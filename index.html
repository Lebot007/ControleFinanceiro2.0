function removeDemo(){
confirmModal({title:"Remover dados de exemplo", danger:true, okLabel:"Remover tudo",
msg:"Isto apaga <b>todos</b> os dados atuais (exemplo + o que você criou) e deixa o sistema zerado, mantendo apenas as categorias padrão.",
onOk:()=>{ const theme=state.settings.theme; state=defaultState(); state.settings.theme=theme; state.initialized=true;
save(); render(); toast("Dados de exemplo removidos."); }});
}
/* ---------- 11. Pesquisa global ---------- */
function doSearch(q){
const box=$("#search-results");
if(!q || q.length<2){ box.classList.remove("open"); return; }
const ql=q.toLowerCase();
const tx=state.transactions.filter(t=>(t.desc+" "+(t.note||"")).toLowerCase().includes(ql)).slice(0,5);
const cats=state.categories.filter(c=>c.name.toLowerCase().includes(ql)).slice(0,3);
const accs=state.accounts.filter(a=>a.name.toLowerCase().includes(ql)).slice(0,3);
const cds=state.cards.filter(c=>c.name.toLowerCase().includes(ql)).slice(0,3);
if(!tx.length&&!cats.length&&!accs.length&&!cds.length){
box.innerHTML=`<div style="padding:16px;font-size:13px;color:var(--ink2)">Nada encontrado para “${esc(q)}”.</div>`;
box.classList.add("open"); return;
}
const grp=(t)=>`<div class="sr-group">${t}</div>`;
let html="";
if(tx.length) html+=grp("Lançamentos")+tx.map(t=>`<button class="sr-item" data-go="tx" data-id="${t.id}">
${icon(t.type==="receita"?"arrowUR":"arrowDR",14)} <span>${esc(t.desc)}</span><small>${fmtDate(t.date)} · ${fmtMoney(t.value)}</small></button>`).join("");
if(cats.length) html+=grp("Categorias")+cats.map(c=>`<button class="sr-item" data-go="cat" data-id="${c.id}">
${icon(c.icon,14)} <span>${esc(c.name)}</span><small>${c.type}</small></button>`).join("");
if(accs.length) html+=grp("Contas")+accs.map(a=>`<button class="sr-item" data-go="acc" data-id="${a.id}">
${icon("bank",14)} <span>${esc(a.name)}</span><small>${fmtMoney(accountBalance(a))}</small></button>`).join("");
if(cds.length) html+=grp("Cartões")+cds.map(c=>`<button class="sr-item" data-go="card" data-id="${c.id}">
${icon("creditCard",14)} <span>${esc(c.name)}</span><small>${esc(c.bank||"")}</small></button>`).join("");
box.innerHTML=html; box.classList.add("open");
}
/* ---------- 12. Roteador e inicialização ---------- */
const ROUTES={
"":"/dashboard", dashboard:"/dashboard", lancamentos:"/lancamentos", contas:"/contas",
receitas:"/receitas", cartoes:"/cartoes", carteiras:"/carteiras", planejamento:"/planejamento",
relatorios:"/relatorios", configuracoes:"/configuracoes"
};
const NAV=[
["dashboard","Visão geral","home"], ["lancamentos","Lançamentos","receipt"],
["contas","Contas a pagar","inbox"], ["receitas","Receitas","trendUp"],
["cartoes","Cartões","creditCard"], ["carteiras","Contas","bank"],
["planejamento","Planejamento","target"], ["relatorios","Relatórios","chart"],
["configuracoes","Configurações","gear"]
];
const TITLES={dashboard:"Visão geral", lancamentos:"Lançamentos", contas:"Contas a pagar", receitas:"Receitas",
cartoes:"Cartões de crédito", carteiras:"Contas e carteiras", planejamento:"Planejamento",
relatorios:"Relatórios", configuracoes:"Configurações"};
function buildNav(){
$("#nav").innerHTML = `<div class="nav-sec">Menu</div>` +
NAV.map(([r,l,ic])=>`<a class="nav-link" href="#/${r}" data-nav="${r}">${icon(ic,17)}<span>${l}</span></a>`).join("");
}
let _lastRoute="";
function render(){
let route=(location.hash.replace("#/","")||"dashboard").split("?")[0];
if(!ROUTES[route]) route="dashboard";
const key=ROUTES[route]==="/dashboard"?"dashboard":route;
$$("#nav .nav-link").forEach(a=>a.classList.toggle("active",a.dataset.nav===key));
$("#page-title").textContent=TITLES[key]||"Fluxo";
closeDrawer();
({dashboard:renderDashboard, lancamentos:renderTransactions, contas:renderBills, receitas:renderIncome,
cartoes:renderCards, carteiras:renderAccounts, planejamento:renderPlanning,
relatorios:renderReports, configuracoes:renderSettings}[key]||renderDashboard)();
if(_lastRoute!==key){ window.scrollTo({top:0,behavior:"auto"}); _lastRoute=key; }
}
function applyTheme(){ document.documentElement.dataset.theme = state.settings.theme==="dark"?"dark":"light";
$("#btn-theme").innerHTML = icon(state.settings.theme==="dark"?"sun":"moon",18); }
function closeDrawer(){ $("#sidebar").classList.remove("open"); $("#scrim").classList.remove("on"); }
function onboarding(){
const ob=document.createElement("div");
ob.id="onboard";
ob.innerHTML=`<div class="ob-card">
<div class="brand-mark">${icon("trendUp",30)}</div>
<h1>Seu dinheiro, com <em>clareza</em> de verdade.</h1>
<p>O Fluxo organiza contas, receitas, despesas, cartões, parcelas e metas — tudo funcionando direto no seu navegador, sem cadastro e sem enviar dados para ninguém.</p>
<div class="ob-actions">
<button class="btn btn-primary" id="ob-start" style="background:#fff;color:#0b2b21">${icon("plus",16)} Começar do zero</button>
<button class="btn btn-ghost" id="ob-demo" style="border-color:rgba(255,255,255,.35);color:#fff;background:rgba(255,255,255,.07)">${icon("sparkles",16)} Ver com dados de exemplo</button>
</div>
<div class="ob-note">${icon("shield",13)} Dados 100% locais · exporte backups quando quiser</div>
</div>`;
document.body.appendChild(ob);
$("#ob-start").onclick=()=>{ state.initialized=true; save(); ob.remove(); toast("Bem-vindo ao Fluxo! Cadastre sua primeira conta em “Contas”."); };
$("#ob-demo").onclick=()=>{ seedDemo(); state.initialized=true; save(); ob.remove(); render(); toast("Dados de exemplo carregados — remova-os em Configurações quando quiser."); };
}
/* Delegação global */
document.addEventListener("click", e=>{
const el=e.target.closest("[data-action],[data-go],[data-nav]");
if(el && el.dataset.go){
const {go,id}=el.dataset;
$("#search-results").classList.remove("open"); $("#global-search").value="";
if(go==="tx"){ const t=state.transactions.find(x=>x.id===id); if(t) openTxModal({tx:t}); }
if(go==="cat"){ location.hash="#/configuracoes"; }
if(go==="acc"){ location.hash="#/carteiras"; }
if(go==="card"){ location.hash="#/cartoes"; }
return;
}
if(!el || !el.dataset.action) return;
const {action,id}=el.dataset;
const tx=state.transactions.find(t=>t.id===id);
switch(action){
case "goto": location.hash="#/"+el.dataset.route; break;
case "new-tx": openTxModal({}); break;
case "new-bill": openTxModal({type:"despesa",status:"pendente"}); break;
case "new-income": openTxModal({type:"receita"}); break;
case "new-rec-income": openRecurrenceModal({type:"receita"}); break;
case "new-card-purchase": openTxModal({type:"despesa",presetCard:true,cardId:id}); break;
case "new-account": openAccountModal(); break;
case "new-card": openCardModal(); break;
case "new-category": openCategoryModal(); break;
case "budget-edit": openBudgetModal(); break;
case "catlimit": openCatLimitModal(id); break;
case "goal-edit": openGoalModal(el.dataset.g); break;
case "tx-pay": if(tx) payTransaction(tx); break;
case "tx-edit": if(tx) openTxModal({tx}); break;
case "tx-dup": if(tx){ state.transactions.push({...tx,id:uid(),status:"pendente",paidDate:undefined}); save(); render(); toast("Lançamento duplicado."); } break;
case "tx-del": if(tx) deleteTransaction(tx); break;
case "tx-clear": ui.txF={q:"",type:"",cat:"",acc:"",status:"",method:"",from:"",to:"",sort:"date-desc",_focus:false}; render(); break;
case "rec-edit": { const r=state.recurrences.find(x=>x.id===id); if(r) openRecurrenceModal(r); break; }
case "rec-toggle": { const r=state.recurrences.find(x=>x.id===id); if(r){ r.active=!r.active; if(r.active){ if(!r.nextDate) r.nextDate=todayISO(); materializeRecurrence(r); } save(); render(); toast(r.active?"Recorrência retomada.":"Recorrência pausada.","warn"); } break; }
case "rec-del": { const r=state.recurrences.find(x=>x.id===id); if(!r) break;
const futureN=state.transactions.filter(t=>t.recurrenceId===id&&t.date>=todayISO()).length;
const ov=openModal({title:"Excluir recorrência", body:`<p style="font-size:14px;color:var(--ink2);line-height:1.6">Excluir <b>${esc(r.desc)}</b>?<br>Há <b>${futureN}</b> lançamento(s) futuro(s) já gerado(s) por ela. Escolha o que fazer:</p>`,
foot:`<button class="btn btn-ghost" data-x>Cancelar</button>
<button class="btn btn-ghost" data-keep>Excluir só a recorrência</button>
<button class="btn btn-danger" data-all>${icon("trash",14)} Excluir + lançamentos futuros</button>`});
ov.querySelector("[data-x]").onclick=ov._close;
ov.querySelector("[data-keep]").onclick=()=>{ state.recurrences=state.recurrences.filter(x=>x.id!==id); save(); ov._close(); render(); toast("Recorrência excluída."); };
ov.querySelector("[data-all]").onclick=()=>{ state.recurrences=state.recurrences.filter(x=>x.id!==id);
state.transactions=state.transactions.filter(t=>!(t.recurrenceId===id&&t.date>=todayISO()));
save(); ov._close(); render(); toast("Recorrência e lançamentos futuros excluídos."); };
break; }
case "card-detail": { const c=cardById(id); if(c) openCardDetail(c); break; }
case "card-edit": { const c=cardById(id); if(c) openCardModal(c); break; }
case "card-del": { const c=cardById(id); if(!c) break;
const n=state.transactions.filter(t=>t.cardId===id).length;
confirmModal({title:"Excluir cartão", danger:true, okLabel:"Excluir cartão",
msg:`Excluir <b>${esc(c.name)}</b>?${n?`<br><b>${n} lançamento(s)</b> vinculados a este cartão também serão excluídos.`:""}`,
onOk:()=>{ state.cards=state.cards.filter(x=>x.id!==id);
state.transactions=state.transactions.filter(t=>t.cardId!==id); save(); render(); toast("Cartão excluído."); }});
break; }
case "acc-edit": { const a=accById(id); if(a) openAccountModal(a); break; }
case "acc-del": { const a=accById(id); if(!a) break;
if(state.transactions.some(t=>t.accountId===id))
return toast("Esta conta possui lançamentos. Exclua ou reatribua os lançamentos antes.","err");
confirmModal({title:"Excluir conta", danger:true, okLabel:"Excluir",
msg:`Excluir <b>${esc(a.name)}</b>?`, onOk:()=>{ state.accounts=state.accounts.filter(x=>x.id!==id); save(); render(); toast("Conta excluída."); }});
break; }
case "cat-edit": { const c=catById(id); if(c) openCategoryModal(c); break; }
case "export-json": exportJSON(); break;
case "import-json": $("#import-file").click(); break;
case "export-csv": openCsvModal(); break;
case "print": window.print(); break;
case "wipe": wipeAll(); break;
case "demo-load": confirmModal({title:"Carregar dados de exemplo", okLabel:"Carregar",
msg:"Será criado um cenário fictício (salário, aluguel, cartões, parcelas). Você pode removê-lo depois em Configurações.",
onOk:()=>{ seedDemo(); save(); render(); toast("Dados de exemplo carregados."); }}); break;
case "demo-remove": removeDemo(); break;
}
});
document.addEventListener("click", e=>{
if(!e.target.closest("#tf-q")) ui.txF._focus=false;
}, true);
document.addEventListener("change", e=>{
if(e.target.matches("[data-filter]")){ ui.txF[e.target.dataset.filter]=e.target.value; render(); }
});
$("#global-search").addEventListener("input", e=>doSearch(e.target.value.trim()));
$("#global-search").addEventListener("focus", e=>{ if(e.target.value.trim().length>=2) doSearch(e.target.value.trim()); });
document.addEventListener("click", e=>{ if(!e.target.closest("#searchbox")) $("#search-results").classList.remove("open"); });
$("#import-file").addEventListener("change", e=>{
const f=e.target.files[0]; if(f) handleImportFile(f); e.target.value="";
});
document.addEventListener("keydown", e=>{
const typing=/input|textarea|select/i.test(document.activeElement?.tagName||"");
if(e.key==="Escape"){ if(modalStack.length){ modalStack[modalStack.length-1]._close(); return; }
$("#search-results").classList.remove("open"); closeDrawer(); }
if(typing) return;
if(e.key==="/"){ e.preventDefault(); $("#global-search").focus(); }
if(e.key.toLowerCase()==="n"){ e.preventDefault(); openQuickModal(); }
});
$("#btn-theme").addEventListener("click", ()=>{ state.settings.theme=state.settings.theme==="dark"?"light":"dark"; applyTheme(); save(); });
$("#btn-menu").addEventListener("click", ()=>{ $("#sidebar").classList.toggle("open"); $("#scrim").classList.toggle("on"); });
$("#scrim").addEventListener("click", closeDrawer);
$("#btn-new-top").addEventListener("click", openQuickModal);
$("#fab").addEventListener("click", openQuickModal);
window.addEventListener("hashchange", render);
(function init(){
$("#brand-mark").innerHTML=icon("trendUp",21);
$("#btn-menu").innerHTML=icon("menu",19);
$("#search-ic").innerHTML=icon("search",15);
$("#btn-new-top").innerHTML=icon("plus",16)+" Novo lançamento";
$("#fab").innerHTML=icon("plus",24);
buildNav();
applyTheme();
materializeAll(); save();
if(!state.initialized) onboarding();
if(!location.hash) location.hash="#/dashboard";
render();
})();
</script>
