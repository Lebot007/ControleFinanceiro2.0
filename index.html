<style>
:root{
--bg:#f1f3ee; --surface:#ffffff; --surface2:#f7f8f4; --ink:#16241e; --ink2:#5d6d64;
--line:#e2e6dd; --line2:#d3d9cd;
--brand:#0e6b4f; --brand-dk:#0a4f3b; --brand-soft:#e0f0e8; --brand-ink:#0c5a42;
--up:#0e9f6e; --up-soft:#e0f4ec; --down:#dd4a48; --down-soft:#fbe9e8;
--warn:#d98e1f; --warn-soft:#faf0dc; --info:#3b6ea8; --info-soft:#e7eef7;
--side:#0b2b21; --side2:#0e3a2c; --side-ink:#cfe3d9; --side-dim:#7fa393;
--shadow:0 1px 2px rgba(20,35,28,.05),0 8px 24px -12px rgba(20,35,28,.18);
--shadow-lg:0 2px 6px rgba(20,35,28,.08),0 24px 48px -16px rgba(20,35,28,.28);
--r:16px; --r-sm:10px;
--disp:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;
--body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
color-scheme:light;
}
[data-theme="dark"]{
--bg:#0c1310; --surface:#141d18; --surface2:#18231d; --ink:#e6efe9; --ink2:#93a59b;
--line:#233029; --line2:#2d3c34;
--brand:#25c48d; --brand-dk:#1da878; --brand-soft:#123529; --brand-ink:#5adbaa;
--up:#2fca8f; --up-soft:#11332a; --down:#f07373; --down-soft:#3a1d1d;
--warn:#e8a94a; --warn-soft:#37290f; --info:#7aa7d9; --info-soft:#152536;
--side:#081712; --side2:#0c221a;
--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.5);
--shadow-lg:0 4px 10px rgba(0,0,0,.4),0 28px 56px -16px rgba(0,0,0,.6);
color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--body);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:clip;
background-image:radial-gradient(1100px 420px at 85% -8%, rgba(14,107,79,.09), transparent 60%),radial-gradient(800px 380px at -10% 20%, rgba(217,142,31,.05), transparent 55%);background-attachment:fixed;}
h1,h2,h3,.disp{font-family:var(--disp)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
a{color:var(--brand)}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
input[type="checkbox"]{accent-color:var(--brand);width:16px;height:16px;cursor:pointer;flex-shrink:0}
#app{display:flex;min-height:100vh}
#sidebar{width:246px;flex-shrink:0;position:fixed;inset:0 auto 0 0;z-index:60;background:linear-gradient(180deg,var(--side) 0%,var(--side2) 140%);color:var(--side-ink);display:flex;flex-direction:column;padding:22px 14px 16px;transition:transform .28s cubic-bezier(.4,0,.2,1)}
#sidebar::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(420px 220px at 20% -5%, rgba(37,196,141,.22), transparent 60%)}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 20px;position:relative}
.brand-mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#1fc48d,#0c7a58);color:#fff;box-shadow:0 6px 16px -6px rgba(31,196,141,.7)}
.brand-name{font-family:var(--disp);font-weight:800;font-size:21px;color:#fff;letter-spacing:-.3px}
.brand-sub{font-size:10.5px;color:var(--side-dim);letter-spacing:.14em;text-transform:uppercase}
#nav{display:flex;flex-direction:column;gap:2px;position:relative;flex:1;overflow-y:auto}
.nav-sec{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--side-dim);padding:14px 12px 6px}
.nav-link{display:flex;align-items:center;gap:11px;padding:9.5px 12px;border-radius:10px;color:var(--side-ink);text-decoration:none;font-size:13.8px;font-weight:500;transition:background .15s,color .15s,transform .15s;position:relative}
.nav-link:hover{background:rgba(255,255,255,.06);color:#fff;transform:translateX(2px)}
.nav-link.active{background:rgba(31,196,141,.16);color:#fff;font-weight:600}
.nav-link.active::before{content:"";position:absolute;left:-14px;top:20%;bottom:20%;width:3.5px;border-radius:4px;background:#1fc48d}
.nav-link .ic{opacity:.85}
.nav-rpg{
position:relative;overflow:hidden;margin-top:2px;
background:linear-gradient(135deg, rgba(112,72,232,.28), rgba(201,162,39,.22));
border:1px solid rgba(201,162,39,.45);color:#ead9a6;
}
.nav-rpg:hover{background:linear-gradient(135deg, rgba(112,72,232,.45), rgba(201,162,39,.38));color:#fff;transform:translateX(2px)}
.nav-rpg .rpg-tag{margin-left:auto;font-size:9px;letter-spacing:.14em;padding:2px 8px;border-radius:99px;
background:linear-gradient(135deg,#c9a227,#7a4d12);color:#fff;font-weight:700}
.nav-rpg::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;
background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);
transform:skewX(-20deg);animation:rpgshine 4s ease-in-out infinite}
@keyframes rpgshine{0%,55%{left:-70%}100%{left:140%}}
@media (prefers-reduced-motion:reduce){.nav-rpg::after{animation:none}}
.side-foot{padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.09);font-size:11.5px;color:var(--side-dim);position:relative}
.side-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#1fc48d;margin-right:6px;box-shadow:0 0 8px #1fc48d}
#main{flex:1;margin-left:246px;display:flex;flex-direction:column;min-width:0}
#topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:12px 26px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
#btn-menu{display:none}
#page-title{font-family:var(--disp);font-weight:700;font-size:17px;white-space:nowrap}
#searchbox{flex:1;max-width:430px;position:relative;margin-left:auto}
#searchbox .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink2)}
#global-search{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:11px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
#global-search:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);outline:none}
#search-results{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);max-height:min(70vh,calc(100vh - 140px));overflow:auto;display:none;z-index:80}
#search-results.open{display:block;animation:pop .18s ease}
.sr-group{padding:8px 14px 2px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.sr-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 14px;text-align:left;font-size:13.5px;border-radius:8px}
.sr-item:hover{background:var(--surface2)}
.sr-item small{color:var(--ink2);margin-left:auto;white-space:nowrap}
.top-actions{display:flex;gap:8px;align-items:center}
#view{padding:26px 26px 90px;max-width:1280px;width:100%;margin:0 auto;animation:viewIn .3s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
#fab{position:fixed;right:20px;bottom:22px;z-index:55;width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#1fc48d,#0c7a58);color:#fff;display:none;place-items:center;box-shadow:0 12px 28px -8px rgba(14,107,79,.55);transition:transform .2s}
#fab:hover{transform:scale(1.06) rotate(90deg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9.5px 16px;border-radius:11px;font-size:13.5px;font-weight:600;border:1px solid transparent;transition:transform .15s,box-shadow .15s,background .15s,border-color .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-dk));color:#fff;box-shadow:0 6px 16px -6px rgba(14,107,79,.5)}
.btn-primary:hover{box-shadow:0 10px 22px -6px rgba(14,107,79,.55);transform:translateY(-1px)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand-ink);transform:translateY(-1px)}
.btn-danger{background:var(--down-soft);color:var(--down)}
.btn-danger:hover{background:var(--down);color:#fff}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.icon-btn{width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;color:var(--ink2);border:1px solid transparent;transition:all .15s}
.note-ic{width:20px;height:20px;border-radius:6px;display:inline-grid;place-items:center;color:var(--info);background:var(--info-soft);vertical-align:middle;flex-shrink:0;margin-left:2px;transition:all .15s}
.note-ic:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.card.lift{transition:transform .2s,box-shadow .2s}.card.lift:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-h h3{font-size:15px;font-weight:700}.card-h .sub{font-size:12px;color:var(--ink2);font-weight:400}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,1fr)}
.kpi{padding:16px 18px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-24px;top:-24px;width:84px;height:84px;border-radius:50%;background:var(--kc,var(--brand-soft));opacity:.35;transition:transform .3s}
.kpi:hover::after{transform:scale(1.25)}
.kpi .k-top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);font-weight:600;letter-spacing:.02em}
.kpi .k-ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--kc,var(--brand-soft));color:var(--ki,var(--brand))}
.kpi .k-val{font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:-.4px;margin-top:8px;position:relative}
.kpi .k-sub{font-size:11.5px;color:var(--ink2);margin-top:2px}
.k-val.pos{color:var(--up)} .k-val.neg{color:var(--down)}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:26px;font-weight:800;letter-spacing:-.5px}.page-head p{color:var(--ink2);font-size:13.5px;margin-top:3px}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{padding:6.5px 13px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink2);transition:all .15s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}.seg button:hover:not(.on){color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink2)}.field label b{color:var(--down)}
.field input,.field select,.field textarea{padding:9.5px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);transition:border-color .15s,box-shadow .15s;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);outline:none}
.field textarea{resize:vertical;min-height:64px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.money-wrap{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;transition:border-color .15s,box-shadow .15s}
.money-wrap:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.money-wrap span{padding:0 4px 0 12px;color:var(--ink2);font-weight:600;font-size:13.5px}
.money-wrap input{border:none!important;box-shadow:none!important;flex:1;padding:9.5px 12px 9.5px 4px;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;background:transparent}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3.5px 10px;border-radius:99px;font-size:11.5px;font-weight:600}
.badge{padding:3.5px 10px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.02em}
.badge.pago{background:var(--up-soft);color:var(--up)}.badge.pendente{background:var(--warn-soft);color:var(--warn)}.badge.vencido{background:var(--down-soft);color:var(--down)}
.progress{height:9px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.progress i{display:block;height:100%;border-radius:99px;background:var(--pc,var(--brand));width:0;transition:width .8s cubic-bezier(.3,.9,.3,1)}
.progress.over i{background:var(--down)}
.table-wrap{overflow-x:auto;padding:0}
.table-wrap>.card-h{padding:16px 20px 0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .12s}tbody tr:hover{background:var(--surface2)}tbody tr:last-child td{border-bottom:none}
.td-main{font-weight:600}.td-sub{font-size:11.5px;color:var(--ink2);font-weight:400;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row-actions{display:flex;gap:2px;justify-content:flex-end;opacity:.35;transition:opacity .15s}
tr:hover .row-actions{opacity:1}@media (hover:none){.row-actions{opacity:1}}
.val-up{color:var(--up);font-weight:700} .val-down{color:var(--down);font-weight:700}
.table-foot{display:flex;gap:22px;padding:13px 16px;border-top:1px solid var(--line);font-size:13px;flex-wrap:wrap}.table-foot b{font-variant-numeric:tabular-nums}
.empty{padding:46px 20px;text-align:center;color:var(--ink2)}
.empty .e-art{width:74px;height:74px;margin:0 auto 16px;border-radius:22px;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand)}
.empty h4{font-family:var(--disp);color:var(--ink);font-size:16px;margin-bottom:5px}.empty p{font-size:13px;max-width:340px;margin:0 auto 16px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 16px;margin-bottom:16px}
.filters input,.filters select{padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:13px}
.filters input[type=search]{flex:1;min-width:170px}.filters input:focus,.filters select:focus{border-color:var(--brand);outline:none}
.sel-all{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;user-select:none;white-space:nowrap}
.sel-all:hover{color:var(--brand-ink)}
.bulk-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:14px;background:var(--brand-soft);border:1px solid var(--brand);border-radius:12px;font-size:13.5px;color:var(--brand-ink);animation:pop .18s ease;flex-wrap:wrap}
.bulk-bar>.ic{color:var(--brand)}
.ck-cell{width:38px}
.cc-grid{grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr))}
.cc-visual{border-radius:16px;padding:18px;color:#fff;position:relative;overflow:hidden;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;margin-bottom:14px;background:linear-gradient(135deg,var(--cc,#0e6b4f) 0%, color-mix(in srgb,var(--cc,#0e6b4f) 55%, #04120d) 130%);box-shadow:0 14px 28px -12px color-mix(in srgb,var(--cc,#0e6b4f) 70%, transparent)}
.cc-visual::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.09);right:-70px;top:-90px}
.cc-visual::after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.06);right:30px;bottom:-70px}
.cc-chip{width:36px;height:27px;border-radius:6px;background:linear-gradient(135deg,#f4d58d,#d9a441);position:relative}.cc-chip::after{content:"";position:absolute;inset:6px 5px;border:1px solid rgba(0,0,0,.25);border-radius:3px}
.cc-name{font-family:var(--disp);font-weight:700;font-size:17px}.cc-bank{font-size:12px;opacity:.75}.cc-num{letter-spacing:.22em;font-size:12px;opacity:.65}
.chart-box svg{width:100%;height:auto;display:block}
.bar-anim{transform:scaleY(0);transform-origin:bottom;animation:grow .7s cubic-bezier(.3,.9,.35,1) forwards}@keyframes grow{to{transform:scaleY(1)}}
.donut-seg{transition:stroke-dashoffset .9s cubic-bezier(.3,.9,.3,1)}
.legend{display:flex;flex-direction:column;gap:9px;font-size:13px}
.legend .lg-row{display:flex;align-items:center;gap:9px}.legend .lg-dot{width:11px;height:11px;border-radius:4px;flex-shrink:0}
.legend .lg-val{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}.legend .lg-pct{color:var(--ink2);font-size:12px;width:44px;text-align:right}
.bill-group h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin:22px 0 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bill-group h4 .count{background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:11px}
.bill{display:flex;align-items:center;gap:14px;padding:13px 16px;background:var(--surface);border:1px solid var(--line);border-radius:13px;margin-bottom:8px;transition:transform .15s,box-shadow .15s}
.bill:hover{transform:translateX(3px);box-shadow:var(--shadow)}
.bill .b-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
.bill .b-mid{flex:1;min-width:0}
.bill .b-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.bill .b-sub{font-size:12px;color:var(--ink2);display:block}
.bill .b-val{font-weight:800;font-family:var(--disp);font-size:15px;white-space:nowrap}
#modal-root .overlay{position:fixed;inset:0;background:rgba(10,22,17,.55);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:0;opacity:0;transition:opacity .2s}
#modal-root .overlay.show{opacity:1}
.modal{background:var(--surface);width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;border-radius:20px 20px 0 0;box-shadow:var(--shadow-lg);transform:translateY(24px);transition:transform .25s cubic-bezier(.3,.9,.3,1)}
.overlay.show .modal{transform:none}.modal.wide{max-width:760px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 0}
.modal-h h3{font-size:18px;font-weight:800;letter-spacing:-.3px}
.modal-b{padding:18px 22px;overflow-y:auto}
.modal-f{padding:14px 22px 20px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);flex-wrap:wrap}

<script>
"use strict";
/* ---------- 1. Utilitários ---------- */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const APP_ID = "fluxo";
const DB_KEY = "fluxo.v1";
const AUTO_KEY = "fluxo.autobackup";
const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const MESES3 = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, "0");
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromISO = s => { const [a,b,c] = String(s).split("-").map(Number); return new Date(a, b-1, c); };
const todayISO = () => isoOf(new Date());
const validDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(fromISO(s).getTime());
const addDays = (iso, n) => { const d = fromISO(iso); d.setDate(d.getDate()+n); return isoOf(d); };
const addMonths = (iso, n) => {
const d = fromISO(iso), day = d.getDate();
d.setDate(1); d.setMonth(d.getMonth()+n);
const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
d.setDate(Math.min(day, last)); return isoOf(d);
};
const monthKey = iso => String(iso).slice(0, 7);
const daysBetween = (a, b) => Math.round((fromISO(b) - fromISO(a)) / 86400000);
const labShort = iso => `${String(iso).slice(8,10)} ${MESES3[+String(iso).slice(5,7)-1]}/${String(iso).slice(2,4)}`;
let _fmtCache = {};
function fmtMoney(cents){
const cur = state.settings.currency || "BRL";
if(!_fmtCache[cur]) _fmtCache[cur] = new Intl.NumberFormat("pt-BR", {style:"currency", currency:cur});
return _fmtCache[cur].format((cents||0)/100);
}
function fmtShort(cents){
const v = (cents||0)/100, a = Math.abs(v);
if(a >= 1e6) return (v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1}) + "M";
if(a >= 1e3) return (v/1e3).toLocaleString("pt-BR",{maximumFractionDigits: a<1e4?1:0}) + "k";
return v.toLocaleString("pt-BR",{maximumFractionDigits:0});
}
function fmtDate(iso){
if(!validDate(iso)) return "—";
const [y,m,d] = String(iso).split("-");
const f = state.settings.dateFormat || "dd/mm/aaaa";
if(f === "aaaa-mm-dd") return iso;
if(f === "mm/dd/aaaa") return `${m}/${d}/${y}`;
return `${d}/${m}/${y}`;
}
const fmtDateShort = iso => validDate(iso) ? `${String(iso).slice(8,10)} ${MESES3[+String(iso).slice(5,7)-1]}` : "—";
function download(name, content, mime){
const b = new Blob([content], {type: mime});
const u = URL.createObjectURL(b);
const a = document.createElement("a");
a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
setTimeout(()=>URL.revokeObjectURL(u), 800);
}
/* ---------- 2. Estado e armazenamento ---------- */
const PAY_METHODS = ["Pix","Dinheiro","Cartão de débito","Cartão de crédito","Boleto","Transferência","Débito automático","Outro"];
const ACC_TYPES = {corrente:"Conta corrente", poupanca:"Poupança", dinheiro:"Dinheiro", digital:"Carteira digital", investimento:"Investimentos", outra:"Outra"};
const PALETTE = ["#e8590c","#1971c2","#f08c00","#e03131","#7048e8","#d6336c","#0ca678","#4c6ef5","#5f3dc4","#b08968","#2f9e44","#8d99ae","#12b886","#f59f00"];
function defaultState(){
const C = (name,type,icon,color)=>({id:uid(),name,type,icon,color});
return {
meta:{app:APP_ID, version:1, createdAt:new Date().toISOString()},
settings:{currency:"BRL", dateFormat:"dd/mm/aaaa", theme:"light", monthStart:1},
categories:[
C("Alimentação","despesa","utensils","#e8590c"), C("Moradia","despesa","home","#1971c2"),
C("Transporte","despesa","car","#f08c00"), C("Saúde","despesa","heart","#e03131"),
C("Educação","despesa","book","#7048e8"), C("Lazer","despesa","ticket","#d6336c"),
C("Compras","despesa","bag","#0ca678"), C("Assinaturas","despesa","repeat","#4c6ef5"),
C("Contas","despesa","receipt","#5f3dc4"), C("Impostos","despesa","landmark","#b08968"),
C("Outros","despesa","dots","#8d99ae"),
C("Salário","receita","briefcase","#2f9e44"), C("Freelance","receita","sparkles","#12b886"),
C("Vendas","receita","tag","#f59f00"), C("Investimentos","receita","trendUp","#37b24d"),
C("Outros","receita","coins","#74c69d")
],
accounts:[], cards:[], transactions:[], recurrences:[],
budgets:{monthly:0, categories:{}},
goals:{saveMonthly:0, netWorth:0},
demo:false, initialized:false
};
}
let state = loadState() || defaultState();
const ui = {
per:{ dashboard:{period:"mes",from:"",to:""}, reports:{period:"mes",from:"",to:""}, csv:{period:"all",from:"",to:""} },
txF:{q:"",type:"",cat:"",acc:"",status:"",method:"",from:"",to:"",sort:"date-desc",_focus:false},
bF:{view:"",cat:"",acc:""}, iF:{view:"",cat:"",acc:""},
sel:{lanc:new Set(), contas:new Set(), receitas:new Set()} };
let _billGroups = {};
let _viewIds = {lanc:[], contas:[], receitas:[]};
function loadState(){
try{
const raw = localStorage.getItem(DB_KEY);
if(!raw) return null;
const d = JSON.parse(raw);
if(d && d.meta && d.meta.app === APP_ID) return mergeDefaults(d);
}catch(e){ console.warn("Falha ao ler dados locais", e); }
return null;
}
function mergeDefaults(d){
const base = defaultState();
const out = {...base, ...d, settings:{...base.settings, ...(d.settings||{})},
budgets:{...base.budgets, ...(d.budgets||{})}, goals:{...base.goals, ...(d.goals||{})}};
["categories","accounts","cards","transactions","recurrences"].forEach(k=>{ if(!Array.isArray(out[k])) out[k]=[]; });
out.accounts.forEach(a=>{ if(!a.createdAt) a.createdAt = todayISO(); });
return out;
}
function save(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(state)); }catch(e){ toast("Não foi possível salvar (armazenamento cheio?).", "err"); } }
/* ---------- Bloqueio / senha de acesso ---------- */
const LOCK_KEY = "fluxo.lock.v1", UNLOCK_KEY = "fluxo.unlocked";
function lockGet(){ try{ const r = localStorage.getItem(LOCK_KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function lockSet(o){ localStorage.setItem(LOCK_KEY, JSON.stringify(o)); }
function lockClear(){ localStorage.removeItem(LOCK_KEY); }
const isUnlocked = () => localStorage.getItem(UNLOCK_KEY) === "1";
const setUnlocked = () => localStorage.setItem(UNLOCK_KEY, "1");
const setLocked = () => localStorage.removeItem(UNLOCK_KEY);
async function sha256hex(str){
const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function randomToken(){
const a = crypto.getRandomValues(new Uint8Array(24));
return Array.from(a).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function checkPassword(lock, pass){ return (await sha256hex(lock.salt + ":" + pass)) === lock.hash; }
async function buildLock(user, pass){
const salt = randomToken(), token = randomToken();
const lock = { user: user||"Usuário", salt, hash: await sha256hex(salt+":"+pass),
recHash: await sha256hex("rec:"+token), createdAt: new Date().toISOString() };
return { lock, token };
}
function recoveryContent(token){ return JSON.stringify({meta:{app:APP_ID,kind:"chave-de-recuperacao",exportedAt:new Date().toISOString()},token},null,2); }
async function downloadRecoveryKey(){
const lock = lockGet(); if(!lock) return;
const token = randomToken();
lock.recHash = await sha256hex("rec:"+token);
lockSet(lock);
download("fluxo-chave-recuperacao.json", recoveryContent(token), "application/json");
toast("Nova chave baixada. A chave anterior foi invalidada.");
}
function paintLockButton(){
const top = document.querySelector(".top-actions"); if(!top) return;
let b = document.querySelector("#btn-lock");
if(lockGet() && !b){
b = document.createElement("button");
b.id="btn-lock"; b.className="icon-btn"; b.title="Bloquear site";
b.setAttribute("aria-label","Bloquear site");
b.innerHTML = icon("shield",17);
b.onclick = ()=>{ setLocked(); location.replace("login.html"); };
top.insertBefore(b, top.firstChild);
} else if(!lockGet() && b){ b.remove(); }
}
function openLockModal(change){
const lock = lockGet();
const passField = (id,label) => `
<div class="field"><label>${label} <b>*</b></label>
<div style="position:relative"><input id="${id}" type="password" autocomplete="off" style="padding-right:44px">
<button class="icon-btn" type="button" data-eye="${id}" style="position:absolute;right:6px;top:50%;transform:translateY(-50%)" aria-label="Mostrar senha">${icon("eye",16)}</button></div></div>`;
const ov = openModal({
title: change ? "Trocar senha de acesso" : "Criar senha de acesso",
body: (change ? passField("lk-cur","Senha atual") + passField("lk-new1","Nova senha") + passField("lk-new2","Confirmar nova senha")
: `<div class="field"><label>Nome de exibição</label><input id="lk-user" maxlength="30" placeholder="Ex.: Maria"></div>` + passField("lk-new1","Senha") + passField("lk-new2","Confirmar senha"))
+ `<div class="hint">${icon("info",13)} <span>Dica: misture letras, números e símbolos para uma senha mais forte. Ao salvar, será baixada a sua <b>chave de recuperação</b> — um arquivo que serve apenas para redefinir a senha, caso você a esqueça. Ele não contém seus dados financeiros.</span></div>`,
foot: `<button class="btn btn-ghost" data-x>Cancelar</button><button class="btn btn-primary" data-save>${icon("check",15)} Salvar</button>`});
ov.querySelectorAll("[data-eye]").forEach(b=> b.onclick = ()=>{
const inp = ov.querySelector("#"+b.dataset.eye);
const show = inp.type === "password";
inp.type = show ? "text" : "password";
b.innerHTML = icon(show ? "eyeOff" : "eye", 16);
b.setAttribute("aria-label", show ? "Ocultar senha" : "Mostrar senha"); });
ov.querySelector("[data-x]").onclick = ov._close;
ov.querySelector("[data-save]").onclick = async ()=>{
const p1 = ov.querySelector("#lk-new1").value, p2 = ov.querySelector("#lk-new2").value;
if(change && !(await checkPassword(lock, ov.querySelector("#lk-cur").value))) return toast("Senha atual incorreta.", "err");
if(p1.length < 4) return toast("A senha precisa de pelo menos 4 caracteres.", "err");
if(p1 !== p2) return toast("As senhas não conferem.", "err");
const user = change ? lock.user : ((ov.querySelector("#lk-user")?.value.trim()) || "Usuário");
const { lock: nl, token } = await buildLock(user, p1);
lockSet(nl);
download("fluxo-chave-recuperacao.json", recoveryContent(token), "application/json");
setUnlocked();
ov._close(); paintLockButton(); render();
toast(change ? "Senha alterada. Nova chave baixada." : "Senha criada. Chave de recuperação baixada.");
};
}
/* ---------- Data Integrity Audit ---------- */
function runAudit() {
let fixes = 0;
let warnings = [];
state.transactions.forEach(t => {
if (t.status === 'pago' && !t.paidDate) {
t.paidDate = t.date || todayISO();
fixes++;
}
});
const catIds = new Set(state.categories.map(c => c.id));
state.transactions.forEach(t => {
if (t.categoryId && !catIds.has(t.categoryId)) {
t.categoryId = null;
fixes++;
}
});
state.recurrences.forEach(r => {
if (r.categoryId && !catIds.has(r.categoryId)) {
r.categoryId = null;
fixes++;
}
});
const accIds = new Set(state.accounts.map(a => a.id));
const cardIds = new Set(state.cards.map(c => c.id));
state.transactions.forEach(t => {
if (t.accountId && !accIds.has(t.accountId)) { t.accountId = null; fixes++; }

function rangeForPeriod(p, from, to){
const t = new Date(), ms = Math.min(Math.max(+state.settings.monthStart||1,1),28);
const cycle = anchor => {
const s = new Date(anchor.getFullYear(), anchor.getMonth(), ms);
if(anchor < s) s.setMonth(s.getMonth()-1);
const e = new Date(s.getFullYear(), s.getMonth()+1, ms-1);
return [isoOf(s), isoOf(e)];
};
if(p==="prev"){ const [cs]=cycle(t); return cycle(fromISO(addDays(cs,-1))); }
if(p==="mes")  return cycle(t);
if(p==="30d")  return [todayISO(), addDays(todayISO(),30)];
if(p==="ano")  return [`${t.getFullYear()}-01-01`, `${t.getFullYear()}-12-31`];
if(p==="custom"){ let f=from||`${t.getFullYear()}-01-01`, g=to||todayISO(); if(f>g){ const tmp=f; f=g; g=tmp; } return [f,g]; }
return cycle(t);
}

for(let i=n-1;i>=0;i--){ const x=new Date(d.getFullYear(), d.getMonth()-i, 1);
out.push({key:`${x.getFullYear()}-${pad(x.getMonth()+1)}`, label:`${MESES3[x.getMonth()]}/${String(x.getFullYear()).slice(2)}`}); }
return out;
}
function monthsInRange(ps,pe){
const out=[]; let y=+ps.slice(0,4), m=+ps.slice(5,7);
const ey=+pe.slice(0,4), em=+pe.slice(5,7); let guard=0;
while((y<ey || (y===ey && m<=em)) && guard++<24){
out.push({key:`${y}-${pad(m)}`, label:`${MESES3[m-1]}/${String(y).slice(2)}`});
m++; if(m>12){m=1;y++;}
}
return out;
}

const e = new Date(s.getFullYear(), s.getMonth()+1, ms-1);
return [isoOf(s), isoOf(e)];
}

function advanceDate(iso, freq, every){
every = Math.max(1, +every||1);
if(freq==="mensal")  return addMonths(iso, every);
if(freq==="semanal") return addDays(iso, 7*every);
if(freq==="anual")   return addMonths(iso, 12*every);
return addDays(iso, every);
}
function materializeRecurrence(r){
if(!r.active) return;
const freq = r.freq || "mensal";
let horizon;
if(freq==="mensal")       horizon = addMonths(todayISO(), 12);
else if(freq==="anual")   horizon = addMonths(todayISO(), 24);
else                      horizon = addDays(todayISO(), 180);
let guard = 0;
const MAXGEN = 1200;
while(r.nextDate && guard++ < MAXGEN){
if(r.endMode==="date" && r.endDate && r.nextDate > r.endDate){ r.active=false; break; }
if(r.endMode==="count" && r.generated >= (r.count||0)){ r.active=false; break; }
if(r.endMode!=="date" && r.endMode!=="count" && r.nextDate > horizon){ break; }
state.transactions.push({
id:uid(), type:r.type, desc:r.desc, value:r.value, date:r.nextDate,
categoryId:r.categoryId, accountId:r.accountId||null, cardId:r.cardId||null,
payMethod:r.payMethod||"Pix", status:"pendente", note:r.note||"",
recurrenceId:r.id, recIndex:(r.generated||0)+1
});
r.nextDate = advanceDate(r.nextDate, r.freq, r.every);
r.generated = (r.generated||0)+1;
}
}
const materializeAll = () => state.recurrences.forEach(materializeRecurrence);
function createInstallments({type, desc, value, firstDate, n, categoryId, accountId, cardId, payMethod, note}){
const groupId = uid();
const base = Math.floor(value/n), rest = value - base*n;
for(let i=0;i<n;i++){
state.transactions.push({
id:uid(), type, desc, value: base + (i===0?rest:0), date: addMonths(firstDate, i),
categoryId, accountId: cardId ? null : accountId, cardId: cardId||null,
payMethod, status:"pendente", note:note||"", groupId, installment:i+1, installments:n
});
}
return groupId;
}

function openModal({title, body, foot, wide, onClose}){

root.appendChild(ov);
requestAnimationFrame(()=>{

const firstInput = ov.querySelector('input, select, textarea, button');
if (firstInput) firstInput.focus();
});
const close = ()=>{ const i=modalStack.indexOf(ov); if(i>-1) modalStack.splice(i,1);
ov.classList.remove("show"); setTimeout(()=>{ov.remove(); onClose&&onClose();}, 210); };
modalStack.push(ov);
ov.addEventListener("mousedown", e=>{ if(e.target===ov) close(); });
ov.querySelector("[data-close]").addEventListener("click", close);
ov._close = close;
return ov;
}

function moneyMask(el){
const fmt = c => (c/100).toLocaleString("pt-BR",{minimumFractionDigits:2, maximumFractionDigits:2});
const setC = c => { el.dataset.cents = String(c); el.value = fmt(c); };
el.setAttribute("inputmode","numeric"); el.setAttribute("autocomplete","off");
if(el.dataset.cents === undefined) setC(0); else el.value = fmt(+el.dataset.cents||0);
el.addEventListener("keydown", e=>{
if(e.ctrlKey || e.metaKey) return;
const c = +el.dataset.cents || 0;
if(/^[0-9]$/.test(e.key)){ e.preventDefault(); if(c < 99999999999) setC(c*10 + +e.key); }
else if(e.key==="Backspace" || e.key==="Delete"){ e.preventDefault(); setC(Math.floor(c/10)); }
else if(["Tab","Shift","ArrowLeft","ArrowRight","Home","End","Enter","Escape"].includes(e.key)) return;
else e.preventDefault();
});
el.addEventListener("paste", e=>{
e.preventDefault();
const digits = (e.clipboardData.getData("text")||"").replace(/\D/g,"").slice(0,11);
setC(+digits || 0);
});
el.addEventListener("focus", ()=> setTimeout(()=>el.select(), 30));
}

function chartBars(months){
const W=640,H=235,P=34, max=Math.max(1,...months.flatMap(m=>[m.rec,m.desp]));
const gw=(W-P*2)/Math.max(1,months.length), bw=Math.min(26, gw*0.26);
let grid="";
for(let i=0;i<=4;i++){ const y=H-30-(H-60)*i/4, v=max*i/4;
grid += `<line x1="${P}" y1="${y}" x2="${W-P/2}" y2="${y}" stroke="var(--line)" stroke-dasharray="${i?'3 5':'0'}"/>
<text x="${P-6}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--ink2)">${fmtShort(v)}</text>`; }
const barRect = (x,h,fill,delay)=>{
if(h<=0) return "";
const hh = Math.max(2,h);
return `<rect class="bar-anim" x="${x}" y="${H-30-hh}" width="${bw}" height="${hh}" rx="5" fill="${fill}" style="animation-delay:${delay}ms"/>`;
};
const bars = months.map((m,i)=>{
const x=P+i*gw+gw/2;
const h1=(H-60)*m.rec/max, h2=(H-60)*m.desp/max;
return `<g><title>${esc(m.label)} — Receitas ${fmtMoney(m.rec)} · Despesas ${fmtMoney(m.desp)}</title>
${barRect(x-bw-2,h1,"var(--up)",i*50)}
${barRect(x+2,h2,"var(--down)",i*50+60)}
<text x="${x}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--ink2)">${esc(m.label)}</text></g>`;
}).join("");
return `<div class="chart-box"><svg viewBox="0 0 ${W} ${H}">${grid}${bars}
<g font-size="11" fill="var(--ink2)">
<circle cx="${W-150}" cy="14" r="5" fill="var(--up)"/><text x="${W-140}" y="18">Receitas</text>
<circle cx="${W-72}" cy="14" r="5" fill="var(--down)"/><text x="${W-62}" y="18">Despesas</text>
</g></svg></div>`;
}
function chartDonut(items){
const total = items.reduce((s,i)=>s+i.value,0);
if(!total) return `<div class="empty" style="padding:30px">${icon("chart",30)}<p style="margin-top:8px">Sem despesas no período.</p></div>`;
items = items.filter(i=>i.value>0).sort((a,b)=>b.value-a.value);
const top = items.slice(0,7), rest = items.slice(7).reduce((s,i)=>s+i.value,0);
const data = rest>0 ? [...top, {label:"Outras", value:rest, color:"#8d99ae"}] : top;
const r=62, C=2*Math.PI*r; let off=0;
const segs = data.map(d=>{
const len = C*d.value/total, s =
`<circle class="donut-seg" cx="100" cy="100" r="${r}" fill="none" stroke="${d.color}" stroke-width="26"
stroke-dasharray="${Math.max(0,len-2)} ${C-len+2}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)">
<title>${esc(d.label)}: ${fmtMoney(d.value)}</title></circle>`;
off += len; return s;
}).join("");
const legend = data.map(d=>`<div class="lg-row"><span class="lg-dot" style="background:${d.color}"></span>
<span>${esc(d.label)}</span><span class="lg-val">${fmtMoney(d.value)}</span>
<span class="lg-pct">${(100*d.value/total).toFixed(1)}%</span></div>`).join("");
return `<div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap">
<div class="chart-box" style="flex:0 0 200px"><svg viewBox="0 0 200 200">${segs}
<text x="100" y="95" text-anchor="middle" font-size="13" font-weight="800" fill="var(--ink)" font-family="var(--disp)">${fmtShort(total)}</text>
<text x="100" y="112" text-anchor="middle" font-size="10" fill="var(--ink2)">total gasto</text></svg></div>
<div class="legend" style="flex:1;min-width:210px">${legend}</div></div>`;
}
function chartArea(points){
if(points.length<2) return `<div class="empty" style="padding:30px">${icon("trendUp",30)}<p style="margin-top:8px">Sem pontos suficientes no período selecionado.</p></div>`;
const W=640,H=230,P=42;
const vals = points.map(p=>p.value), min=Math.min(...vals,0), max=Math.max(...vals,1), span=(max-min)||1;
const X=i=>P+(W-P-16)*i/(points.length-1), Y=v=>H-34-(H-64)*((v-min)/span);
let line=`M${X(0)} ${Y(points[0].value)}`;
for(let i=1;i<points.length;i++) line+=` L${X(i)} ${Y(points[i].value)}`;
const area = line + ` L${X(points.length-1)} ${H-34} L${X(0)} ${H-34} Z`;
const dots = points.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.value)}" r="4" fill="var(--brand)" stroke="var(--surface)" stroke-width="2">
<title>${esc(p.label)}: ${fmtMoney(p.value)}</title></circle>
<text x="${X(i)}" y="${H-12}" text-anchor="middle" font-size="10.5" fill="var(--ink2)">${esc(p.label)}</text>`).join("");
return `<div class="chart-box"><svg viewBox="0 0 ${W} ${H}">
<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="var(--brand)" stop-opacity=".30"/><stop offset="1" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs>
<line x1="${P}" y1="${Y(0)}" x2="${W-16}" y2="${Y(0)}" stroke="var(--line2)" stroke-dasharray="4 5"/>
<text x="${P-6}" y="${Y(max)+4}" text-anchor="end" font-size="10" fill="var(--ink2)">${fmtShort(max)}</text>
<text x="${P-6}" y="${Y(min)+4}" text-anchor="end" font-size="10" fill="var(--ink2)">${fmtShort(min)}</text>
<path d="${area}" fill="url(#ag)"/><path d="${line}" fill="none" stroke="var(--brand)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
${dots}</svg></div>`;
}
function balanceSeries(nMonths=8){
const deltas={};
state.transactions.filter(t=>t.status==="pago").forEach(t=>{
const k=monthKey(t.date); deltas[k]=(deltas[k]||0)+(t.type==="receita"?t.value:-t.value); });
let cum = state.accounts.reduce((s,a)=>s+(a.initial||0),0);
const keys = Object.keys(deltas).sort();
const pts = keys.map(k=>{ cum+=deltas[k]; return {label:`${MESES3[+k.slice(5,7)-1]}/${k.slice(2,4)}`, value:cum}; });
if(!pts.length) pts.push({label:labShort(todayISO()), value:cum});
pts.push({label:"Hoje", value:netWorth()});
return pts.slice(-nMonths);
}
function balanceSeriesForRange(ps,pe){
const paid = state.transactions.filter(t=>t.status==="pago" && t.date<=pe);
const base = state.accounts.reduce((s,a)=>s+(a.initial||0),0);
const valAt = d => { let v=base; for(const t of paid){ if(t.date<=d) v += t.type==="receita"?t.value:-t.value; } return v; };
const pts=[{label:labShort(ps), value:valAt(ps)}];
let y=+ps.slice(0,4), m=+ps.slice(5,7), guard=0;
while(guard++<24){
const end=isoOf(new Date(y,m,0));
if(end>ps && end<pe) pts.push({label:labShort(end), value:valAt(end)});
m++; if(m>12){m=1;y++;}
if(end>=pe) break;
}
if(pe>ps) pts.push({label:labShort(pe), value:valAt(pe)});
if(pts.length<2) pts.push({label:labShort(pe), value:valAt(pe)});
return pts;
}

/* ---------- Automatic Insights ---------- */
function getInsights() {
const insights = [];
const [cs, ce] = cycleRange(new Date());
const inCyc = t => inRange(t.date, cs, ce);
const txCyc = state.transactions.filter(t => inCyc(t) && t.status === 'pago');
const recCyc = txCyc.filter(t => t.type === 'receita').reduce((s, t) => s + t.value, 0);
const despCyc = txCyc.filter(t => t.type === 'despesa').reduce((s, t) => s + t.value, 0);
if (recCyc > 0) {
const rate = Math.round(((recCyc - despCyc) / recCyc) * 100);
if (rate > 20) insights.push({icon: 'trendUp', text: `Excelente! Você economizou <b>${rate}%</b> da sua receita neste ciclo.`});
else if (rate < 0) insights.push({icon: 'alert', text: `Atenção: Suas despesas superaram as receitas neste ciclo.`});
}
const despList = txCyc.filter(t => t.type === 'despesa').sort((a, b) => b.value - a.value);
if (despList.length > 0) {
const top = despList[0];
insights.push({icon: 'arrowDR', text: `Maior despesa do mês: <b>${esc(top.desc)}</b> (${fmtMoney(top.value)}).`});
}
const catSpend = {};
txCyc.filter(t => t.type === 'despesa').forEach(t => {
catSpend[t.categoryId] = (catSpend[t.categoryId] || 0) + t.value;
});
const last3Months = lastMonths(4).slice(1, 4);
const avgCatSpend = {};
last3Months.forEach(m => {
state.transactions.filter(t => monthKey(t.date) === m.key && t.type === 'despesa' && t.status === 'pago').forEach(t => {
avgCatSpend[t.categoryId] = (avgCatSpend[t.categoryId] || 0) + t.value;
});
});
Object.keys(avgCatSpend).forEach(k => avgCatSpend[k] /= 3);
for (const [catId, spent] of Object.entries(catSpend)) {
const avg = avgCatSpend[catId] || 0;
if (avg > 0 && spent > avg * 1.3) {
const c = catById(catId);
if (c) insights.push({icon: 'alert', text: `Gastos com <b>${esc(c.name)}</b> estão <b>${Math.round((spent/avg - 1)*100)}%</b> acima da média dos últimos 3 meses.`});
}
}
return insights.slice(0, 3);
}
function renderDashboard(){
const [ps,pe] = periodRange("dashboard");
const inP = t => inRange(t.date, ps, pe);
const txP = state.transactions.filter(inP);
const rec = txP.filter(t=>t.type==="receita").reduce((s,t)=>s+t.value,0);
const desp = txP.filter(t=>t.type==="despesa").reduce((s,t)=>s+t.value,0);
const nw = netWorth();
const [csC,ceC] = cycleRange(new Date());
const paidMonthDelta = state.transactions.filter(t=>t.status==="pago"&&inRange(t.date,csC,ceC))
.reduce((s,t)=>s+(t.type==="receita"?t.value:-t.value),0);
const forecast = nw
+ state.transactions.filter(t=>t.status!=="pago"&&t.type==="receita").reduce((s,t)=>s+t.value,0)

function filteredTx(){
const f=ui.txF;
let list=[...state.transactions];
if(f.q){ const q=f.q.toLowerCase(); list=list.filter(t=> (t.desc+" "+(t.note||"")).toLowerCase().includes(q)); }
if(f.type) list=list.filter(t=>f.type===t.type);
if(f.cat) list=list.filter(t=>t.categoryId===f.cat);
if(f.acc) list=list.filter(t=>t.accountId===f.acc||t.cardId===f.acc);
if(f.status) list=list.filter(t=>txStatus(t)===f.status);
if(f.method) list=list.filter(t=>t.payMethod===f.method);
if(f.from) list=list.filter(t=>t.date>=f.from);
if(f.to) list=list.filter(t=>t.date<=f.to);
const S={ "date-desc":(a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id),
"date-asc":(a,b)=>a.date.localeCompare(b.date),
"val-desc":(a,b)=>b.value-a.value, "val-asc":(a,b)=>a.value-b.value,
"desc":(a,b)=>a.desc.localeCompare(b.desc,"pt-BR") };
return list.sort(S[f.sort]||S["date-desc"]);
}

t.recurrenceId?icon("repeat",12):"" ].join("");
return `<tr>
<td data-label="Selecionar" class="td-first ck-cell"><input type="checkbox" data-ck="lanc" data-id="${t.id}" ${ui.sel.lanc.has(t.id)?"checked":""} aria-label="Selecionar lançamento"></td>

function openCardDetail(card){
const buildBody=()=>{
const inst=state.transactions.filter(t=>t.cardId===card.id&&t.type==="despesa");
const months=[...new Set(inst.map(t=>monthKey(t.date)))].sort();
const s=cardStats(card);
const block=(mk,label)=>{
const rows=inst.filter(t=>monthKey(t.date)===mk).sort((a,b)=>a.date.localeCompare(b.date));
if(!rows.length) return "";
const total=rows.reduce((x,t)=>x+t.value,0), open=rows.some(t=>t.status!=="pago");
return `<div class="invoice-block">
<div class="ib-h"><span>${label}</span><span class="ib-total num">${fmtMoney(total)}</span>
${open?`<button class="btn btn-primary btn-sm" data-payinv="${mk}" aria-label="Pagar fatura">${icon("check",13)} Pagar fatura</button>`:`<span class="badge pago">Paga</span>`}</div>
${rows.map(t=>`<div class="inv-row"><span class="iv-d num">${fmtDate(t.date)}</span>
<span class="iv-n">${esc(t.desc)} ${t.installment?`<b style="color:var(--ink2)">· ${t.installment}/${t.installments}</b>`:""}</span>
<span class="badge ${txStatus(t)}">${txStatus(t)==="pago"?"Paga":txStatus(t)==="vencido"?"Vencida":"Aberta"}</span>
<b class="num">${fmtMoney(t.value)}</b>
${t.status!=="pago"?`<button class="icon-btn" title="Pagar parcela" aria-label="Pagar parcela" data-action="tx-pay" data-id="${t.id}">${icon("check",14)}</button>`:""}
</div>`).join("")}</div>`;
};
const nowMk=monthKey(todayISO());
const past=months.filter(m=>m<nowMk), future=months.filter(m=>m>nowMk);
return `
<div style="display:flex;gap:20px;flex-wrap:wrap;margin-bottom:16px;font-size:13px">
<span>Limite: <b class="num">${fmtMoney(card.limit||0)}</b></span>
<span>Utilizado: <b class="num" style="color:var(--down)">${fmtMoney(s.used)}</b></span>

<span>Vencimento: <b>dia ${card.dueDay}</b></span>
</div>
${[...past.map(m=>block(m,"Fatura "+m.split("-").reverse().join("/"))),
block(nowMk,`Fatura atual (${MESES3[+nowMk.slice(5,7)-1]}/${nowMk.slice(2,4)})`),
...future.map(m=>block(m,"Fatura futura "+m.split("-").reverse().join("/")))].join("") ||
emptyBlock("creditCard","Sem compras neste cartão","Use o botão “Compra” para registrar.")}`;
};
const ov=openModal({wide:true, title:`${esc(card.name)} — faturas e parcelas`, body:buildBody(),
foot:`<button class="btn btn-ghost" data-x>Fechar</button><button class="btn btn-primary" data-buy aria-label="Nova compra no cartão">${icon("plus",14)} Nova compra</button>`});
ov.dataset.cardDetail=card.id;
const bindPay=()=>ov.querySelectorAll("[data-payinv]").forEach(b=>b.onclick=()=>{
const mk=b.dataset.payinv;
accountPickModal(accId=>{
let n=0,sum=0;
state.transactions.forEach(t=>{ if(t.cardId===card.id&&t.status!=="pago"&&monthKey(t.date)===mk){
t.status="pago"; t.accountId=accId; t.paidDate=todayISO(); n++; sum+=t.value; } });
save(); render(); toast(`Fatura paga: ${n} parcela(s), ${fmtMoney(sum)}.`);
refresh();
}, "Pagar fatura com qual conta?");
});
const refresh=()=>{ ov.querySelector(".modal-b").innerHTML=buildBody(); bindPay(); };
ov._refresh=refresh;
bindPay();
ov.querySelector("[data-x]").onclick=ov._close;
ov.querySelector("[data-buy]").onclick=()=>{ ov._close(); openTxModal({type:"despesa",presetCard:true,cardId:card.id}); };
}

function handleImportFile(file){
const rd=new FileReader();
rd.onerror=()=>toast("Arquivo inválido.","err");
rd.onload=()=>{
let obj;
try{ obj=JSON.parse(rd.result); }catch(e){ return toast("Arquivo inválido — não é um JSON válido.","err"); }
if(!obj || typeof obj!=="object" || !obj.meta || obj.meta.app!==APP_ID || !obj.data || !Array.isArray(obj.data.transactions))
return toast("Este backup não é compatível.","err");
const d=obj.data;
const counts={lanc:(d.transactions||[]).length, cat:(d.categories||[]).length, contas:(d.accounts||[]).length,
cartoes:(d.cards||[]).length, recorr:(d.recurrences||[]).length};
const ov=openModal({title:"Restaurar backup",
body:`<p style="font-size:14px;color:var(--ink2);line-height:1.6">Backup de <b>${esc((obj.meta.exportedAt||"").slice(0,10))}</b> encontrado:</p>
<p style="font-size:13px;color:var(--ink2);line-height:1.8;margin-top:6px">
• ${counts.lanc} lançamentos<br>• ${counts.cat} categorias<br>• ${counts.contas} contas<br>• ${counts.cartoes} cartões<br>• ${counts.recorr} recorrências</p>
<p style="font-size:13px;margin-top:12px"><b>Os dados atuais serão substituídos.</b></p>
<label style="display:flex;align-items:flex-start;gap:10px;margin-top:12px;padding:11px 13px;border:1px dashed var(--line2);border-radius:11px;cursor:pointer;font-size:13.5px;font-weight:600">
<input type="checkbox" id="ck-backup" checked style="width:auto;margin-top:2px">
<span>Baixar um backup da versão atual antes de substituir (recomendado)</span>
</label>
<p style="font-size:12px;color:var(--ink2);margin-top:8px">Uma cópia interna também fica salva neste navegador, mesmo se você desmarcar a opção.</p>`,
foot:`<button class="btn btn-ghost" data-x>Cancelar</button><button class="btn btn-primary" data-ok aria-label="Restaurar backup">${icon("upload",15)} Restaurar</button>`});
ov.querySelector("[data-x]").onclick=ov._close;
ov.querySelector("[data-ok]").onclick=()=>{
const wantFile=ov.querySelector("#ck-backup").checked;
const json=snapshotCurrent();
ov._close();
if(wantFile) download(`backup-automatico-${todayISO()}.json`, json, "application/json");
state=mergeDefaults({meta:{app:APP_ID,version:1}, ...d});
materializeAll(); save(); _fmtCache={}; applyTheme(); render();
toast(wantFile?"Backup restaurado — cópia da versão anterior baixada.":"Backup restaurado com sucesso.");
};
};
rd.readAsText(file);
}
function exportCSVRange(ps,pe){
const rows=[["Data","Descrição","Tipo","Categoria","Valor","Conta","Cartão","Forma de pagamento","Status","Parcela","Observação"]];
const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
const list=[...state.transactions].filter(t=>t.date>=ps&&t.date<=pe).sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));
list.forEach(t=>{
const c=catById(t.categoryId), a=accById(t.accountId), k=cardById(t.cardId);
rows.push([fmtDate(t.date), t.desc, t.type==="receita"?"Receita":"Despesa", c?c.name:"",
(t.value/100).toFixed(2).replace(".",","), a?a.name:"", k?k.name:"", t.payMethod||"",
txStatus(t), t.installment?`${t.installment}/${t.installments}`:"", t.note||""]);
});
download(`lancamentos-${todayISO()}.csv`, "\uFEFF"+rows.map(r=>r.map(q).join(";")).join("\r\n"), "text/csv;charset=utf-8");
toast(`CSV exportado (${list.length} lançamento(s)).`);
}
function openCsvModal(){
const ov=openModal({title:"Exportar lançamentos (.csv)", body:`
<p style="font-size:13px;color:var(--ink2);margin-bottom:14px">Escolha o período dos lançamentos a exportar. A data sai no formato <b>${esc(state.settings.dateFormat)}</b>.</p>
<div class="field"><label>Período</label><select id="csv-period" aria-label="Selecionar período">
${opt("all","Todos os lançamentos",true)}${opt("mes","Este mês")}${opt("prev","Mês passado")}${opt("30d","Próximos 30 dias")}${opt("ano","Este ano")}${opt("custom","Personalizado")}</select></div>
<div class="grid2" id="csv-custom" style="display:none">
<div class="field"><label>De</label><input type="date" id="csv-from" aria-label="Data inicial"></div>
<div class="field"><label>Até</label><input type="date" id="csv-to" aria-label="Data final"></div>
</div>
<p id="csv-count" style="font-size:12.5px;color:var(--ink2)"></p>`,
foot:`<button class="btn btn-ghost" data-x>Cancelar</button><button class="btn btn-primary" data-ok aria-label="Exportar CSV">${icon("download",15)} Exportar</button>`});
const q=s=>ov.querySelector(s);
const cp=ui.per.csv;
if(!validDate(cp.from)||!validDate(cp.to)){ const [csvPs,csvPe]=rangeForPeriod("mes"); cp.from=csvPs; cp.to=csvPe; }
q("#csv-period").value=cp.period;
q("#csv-custom").style.display = cp.period==="custom"?"":"none";
q("#csv-from").value = cp.from;
q("#csv-to").value = cp.to;
const csvRange=()=>{
const p=q("#csv-period").value;
if(p==="all") return ["0000-01-01","9999-12-31"];
if(p==="custom"){ let f=q("#csv-from").value||"0000-01-01", g=q("#csv-to").value||"9999-12-31"; if(f>g){const t2=f;f=g;g=t2;} return [f,g]; }
return rangeForPeriod(p);
};
const updateCount=()=>{ const [ps,pe]=csvRange();
const n=state.transactions.filter(t=>t.date>=ps&&t.date<=pe).length;
q("#csv-count").textContent=`${n} lançamento(s) no período selecionado.`; };
q("#csv-period").onchange=()=>{ cp.period=q("#csv-period").value; q("#csv-custom").style.display= cp.period==="custom"?"":"none"; updateCount(); };
q("#csv-from").onchange=()=>{ if(validDate(q("#csv-from").value)) cp.from=q("#csv-from").value; updateCount(); };
q("#csv-to").onchange=()=>{ if(validDate(q("#csv-to").value)) cp.to=q("#csv-to").value; updateCount(); };
updateCount();
q("[data-x]").onclick=ov._close;
q("[data-ok]").onclick=()=>{ if(ov._saving) return; ov._saving=true; q("[data-ok]").disabled=true;
const [ps,pe]=csvRange(); ov._close(); exportCSVRange(ps,pe); };
}

function doSearch(q){
const box=$("#search-results");
if(!q || q.length<2){ box.classList.remove("open"); return; }
const ql=q.toLowerCase();
const tx=state.transactions.filter(t=>(t.desc+" "+(t.note||"")).toLowerCase().includes(ql)).slice(0,5);
const cats=state.categories.filter(c=>c.name.toLowerCase().includes(ql)).slice(0,3);
const accs=state.accounts.filter(a=>a.name.toLowerCase().includes(ql)).slice(0,3);
const cds=state.cards.filter(c=>c.name.toLowerCase().includes(ql)).slice(0,3);
if(!tx.length&&!cats.length&&!accs.length&&!cds.length){
box.innerHTML=`<div style="padding:16px;font-size:13px;color:var(--ink2)">Nada encontrado para “${esc(q)}”.</div>`;
box.classList.add("open"); return;
}
const grp=(t)=>`<div class="sr-group">${t}</div>`;
let html="";
if(tx.length) html+=grp("Lançamentos")+tx.map(t=>`<button class="sr-item" data-go="tx" data-id="${t.id}" aria-label="Ver lançamento ${esc(t.desc)}">
${icon(t.type==="receita"?"arrowUR":"arrowDR",14)} <span>${esc(t.desc)}</span><small>${fmtDate(t.date)} · ${fmtMoney(t.value)}</small></button>`).join("");
if(cats.length) html+=grp("Categorias")+cats.map(c=>`<button class="sr-item" data-go="cat" data-id="${c.id}" aria-label="Ver categoria ${esc(c.name)}">
${icon(c.icon,14)} <span>${esc(c.name)}</span><small>${c.type}</small></button>`).join("");
if(accs.length) html+=grp("Contas")+accs.map(a=>`<button class="sr-item" data-go="acc" data-id="${a.id}" aria-label="Ver conta ${esc(a.name)}">
${icon("bank",14)} <span>${esc(a.name)}</span><small>${fmtMoney(accountBalance(a))}</small></button>`).join("");
if(cds.length) html+=grp("Cartões")+cds.map(c=>`<button class="sr-item" data-go="card" data-id="${c.id}" aria-label="Ver cartão ${esc(c.name)}">
${icon("creditCard",14)} <span>${esc(c.name)}</span><small>${esc(c.bank||"")}</small></button>`).join("");
box.innerHTML=html; box.classList.add("open");
}

document.addEventListener("click", e=>{

case "reopen-sel": {

case "rec-del": { const r=state.recurrences.find(x=>x.id===id); if(!r) break;

state.transactions=state.transactions.filter(t=>!(t.recurrenceId===id&&t.date>=todayISO()));
save(); ov._close(); render(); toast("Recorrência e lançamentos futuros excluídos."); };
break; }
case "card-detail": { const c=cardById(id); if(c) openCardDetail(c); break; }

document.addEventListener("click", e=>{
if(!e.target.closest("#tf-q")) ui.txF._focus=false;
}, true);
document.addEventListener("change", e=>{
const tg=e.target;
if(tg.matches("[data-filter]")){ ui.txF[tg.dataset.filter]=tg.value; render(); return; }
if(tg.matches("[data-bfilter]")){ ui.bF[tg.dataset.bfilter]=tg.value; render(); return; }
if(tg.matches("[data-ifilter]")){ ui.iF[tg.dataset.ifilter]=tg.value; render(); return; }
if(tg.dataset && tg.dataset.ck && ui.sel[tg.dataset.ck]){
const set=ui.sel[tg.dataset.ck];
if(tg.checked) set.add(tg.dataset.id); else set.delete(tg.dataset.id);
render(); return;
}
if(tg.dataset && tg.dataset.ckall && ui.sel[tg.dataset.ckall]){
const key=tg.dataset.ckall, set=ui.sel[key];
if(tg.checked){ for(const i of _viewIds[key]) set.add(i); }
else { for(const i of _viewIds[key]) set.delete(i); }
render(); return;
}
});

/* ----- Botão "Instalar App": só no navegador, nunca dentro do app ----- */
const isStandalone = () =>
window.matchMedia('(display-mode: standalone)').matches ||
window.matchMedia('(display-mode: window-controls-overlay)').matches ||
navigator.standalone === true;
let deferredPrompt = null;
function createInstallButton(){
// Se está em standalone (app instalado), não cria o botão
if (isStandalone()) {
const existing = document.querySelector('#btn-install');
if (existing) existing.remove();
return;
}
const topActions = document.querySelector('.top-actions');
if(!topActions || document.querySelector('#btn-install')) return;
const btn = document.createElement('button');
btn.id = 'btn-install';
btn.className = 'btn btn-ghost btn-sm';
btn.innerHTML = `${icon('download',14)} Instalar App`;
btn.setAttribute('aria-label','Instalar aplicativo');
btn.onclick = async () => {
if (deferredPrompt) {
deferredPrompt.prompt();
await deferredPrompt.userChoice;
deferredPrompt = null;
return;
}
toast('Não foi possível abrir o diálogo agora. Instale pelo menu do navegador (⋮ ou ☰ → "Instalar aplicativo…").', 'info');
};
topActions.insertBefore(btn, topActions.firstChild);
}
// Cria o botão imediatamente se não estiver em standalone
if (!isStandalone()) {
createInstallButton();
}
window.addEventListener('beforeinstallprompt', (e) => {
if (isStandalone()) return;
e.preventDefault();
deferredPrompt = e;
createInstallButton();
});
window.addEventListener('appinstalled', () => {
toast('Aplicativo instalado com sucesso!');
deferredPrompt = null;
const btn = document.querySelector('#btn-install');
if (btn) btn.remove();
});
/* Se há bloqueio ativo e a sessão não está desbloqueada, vai para a tela de login */
if (lockGet() && !isUnlocked()) location.replace("login.html");
(function init(){
$("#brand-mark").innerHTML=icon("trendUp",21);
$("#btn-menu").innerHTML=icon("menu",19);
$("#search-ic").innerHTML=icon("search",15);
$("#btn-new-top").innerHTML=icon("plus",16)+" Novo lançamento";
$("#fab").innerHTML=icon("plus",24);
buildNav();
applyTheme();
paintLockButton();
materializeAll(); save();
runAudit(); // Run data integrity audit
if(!state.initialized) onboarding();
if(!location.hash) location.hash="#/dashboard";
render();
})();
</script>
