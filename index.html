<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluxo — Finanças Pessoais</title>
<meta name="description" content="Organizador financeiro pessoal completo: contas, receitas, despesas, cartões, parcelas e planejamento. Seus dados ficam somente no seu navegador.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#f1f3ee; --surface:#ffffff; --surface2:#f7f8f4; --ink:#16241e; --ink2:#5d6d64;
--line:#e2e6dd; --line2:#d3d9cd;
--brand:#0e6b4f; --brand-dk:#0a4f3b; --brand-soft:#e0f0e8; --brand-ink:#0c5a42;
--up:#0e9f6e; --up-soft:#e0f4ec; --down:#dd4a48; --down-soft:#fbe9e8;
--warn:#d98e1f; --warn-soft:#faf0dc; --info:#3b6ea8; --info-soft:#e7eef7;
--side:#0b2b21; --side2:#0e3a2c; --side-ink:#cfe3d9; --side-dim:#7fa393;
--shadow:0 1px 2px rgba(20,35,28,.05),0 8px 24px -12px rgba(20,35,28,.18);
--shadow-lg:0 2px 6px rgba(20,35,28,.08),0 24px 48px -16px rgba(20,35,28,.28);
--r:16px; --r-sm:10px;
--disp:'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif;
--body:'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
[data-theme="dark"]{
--bg:#0c1310; --surface:#141d18; --surface2:#18231d; --ink:#e6efe9; --ink2:#93a59b;
--line:#233029; --line2:#2d3c34;
--brand:#25c48d; --brand-dk:#1da878; --brand-soft:#123529; --brand-ink:#5adbaa;
--up:#2fca8f; --up-soft:#11332a; --down:#f07373; --down-soft:#3a1d1d;
--warn:#e8a94a; --warn-soft:#37290f; --info:#7aa7d9; --info-soft:#152536;
--side:#081712; --side2:#0c221a;
--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.5);
--shadow-lg:0 4px 10px rgba(0,0,0,.4),0 28px 56px -16px rgba(0,0,0,.6);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
font-family:var(--body); color:var(--ink); background:var(--bg);
font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
overflow-x:clip;
background-image:radial-gradient(1100px 420px at 85% -8%, rgba(14,107,79,.09), transparent 60%),
radial-gradient(800px 380px at -10% 20%, rgba(217,142,31,.05), transparent 55%);
background-attachment:fixed;
}
h1,h2,h3,.disp{font-family:var(--disp)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
a{color:var(--brand)}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
#app{display:flex;min-height:100vh}
#sidebar{
width:246px;flex-shrink:0;position:fixed;inset:0 auto 0 0;z-index:60;
background:linear-gradient(180deg,var(--side) 0%,var(--side2) 140%);
color:var(--side-ink);display:flex;flex-direction:column;padding:22px 14px 16px;
transition:transform .28s cubic-bezier(.4,0,.2,1);
}
#sidebar::before{content:"";position:absolute;inset:0;pointer-events:none;
background:radial-gradient(420px 220px at 20% -5%, rgba(37,196,141,.22), transparent 60%)}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 20px;position:relative}
.brand-mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
background:linear-gradient(135deg,#1fc48d,#0c7a58);color:#fff;box-shadow:0 6px 16px -6px rgba(31,196,141,.7)}
.brand-name{font-family:var(--disp);font-weight:800;font-size:21px;color:#fff;letter-spacing:-.3px}
.brand-sub{font-size:10.5px;color:var(--side-dim);letter-spacing:.14em;text-transform:uppercase}
#nav{display:flex;flex-direction:column;gap:2px;position:relative;flex:1;overflow-y:auto}
.nav-sec{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--side-dim);padding:14px 12px 6px}
.nav-link{display:flex;align-items:center;gap:11px;padding:9.5px 12px;border-radius:10px;
color:var(--side-ink);text-decoration:none;font-size:13.8px;font-weight:500;
transition:background .15s,color .15s,transform .15s;position:relative}
.nav-link:hover{background:rgba(255,255,255,.06);color:#fff;transform:translateX(2px)}
.nav-link.active{background:rgba(31,196,141,.16);color:#fff;font-weight:600}
.nav-link.active::before{content:"";position:absolute;left:-14px;top:20%;bottom:20%;width:3.5px;border-radius:4px;background:#1fc48d}
.nav-link .ic{opacity:.85}
.side-foot{padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.09);font-size:11.5px;color:var(--side-dim);position:relative}
.side-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#1fc48d;margin-right:6px;box-shadow:0 0 8px #1fc48d}
#main{flex:1;margin-left:246px;display:flex;flex-direction:column;min-width:0}
#topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;
padding:12px 26px;background:color-mix(in srgb,var(--bg) 82%,transparent);
backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
#btn-menu{display:none}
#page-title{font-family:var(--disp);font-weight:700;font-size:17px;white-space:nowrap}
#searchbox{flex:1;max-width:430px;position:relative;margin-left:auto}
#searchbox .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink2)}
#global-search{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:11px;
background:var(--surface);transition:border-color .15s, box-shadow .15s}
#global-search:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);outline:none}
#search-results{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--surface);
border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);max-height:min(70vh, calc(100vh - 140px));overflow:auto;display:none;z-index:80}
#search-results.open{display:block;animation:pop .18s ease}
.sr-group{padding:8px 14px 2px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.sr-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 14px;text-align:left;font-size:13.5px;border-radius:8px}
.sr-item:hover{background:var(--surface2)}
.sr-item small{color:var(--ink2);margin-left:auto;white-space:nowrap}
.top-actions{display:flex;gap:8px;align-items:center}
#view{padding:26px 26px 90px;max-width:1280px;width:100%;margin:0 auto;animation:viewIn .3s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
#fab{position:fixed;right:20px;bottom:22px;z-index:55;width:58px;height:58px;border-radius:18px;
background:linear-gradient(135deg,#1fc48d,#0c7a58);color:#fff;display:none;place-items:center;
box-shadow:0 12px 28px -8px rgba(14,107,79,.55);transition:transform .2s}
#fab:hover{transform:scale(1.06) rotate(90deg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9.5px 16px;
border-radius:11px;font-size:13.5px;font-weight:600;border:1px solid transparent;
transition:transform .15s, box-shadow .15s, background .15s, border-color .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-dk));color:#fff;box-shadow:0 6px 16px -6px rgba(14,107,79,.5)}
.btn-primary:hover{box-shadow:0 10px 22px -6px rgba(14,107,79,.55);transform:translateY(-1px)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand-ink);transform:translateY(-1px)}
.btn-danger{background:var(--down-soft);color:var(--down)}
.btn-danger:hover{background:var(--down);color:#fff}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.icon-btn{width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;color:var(--ink2);
border:1px solid transparent;transition:all .15s}
.icon-btn:hover{background:var(--surface2);color:var(--ink);border-color:var(--line);transform:translateY(-1px)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.card.lift{transition:transform .2s, box-shadow .2s}
.card.lift:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-h h3{font-size:15px;font-weight:700}
.card-h .sub{font-size:12px;color:var(--ink2);font-weight:400}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,1fr)}
.kpi{padding:16px 18px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-24px;top:-24px;width:84px;height:84px;border-radius:50%;
background:var(--kc,var(--brand-soft));opacity:.35;transition:transform .3s}
.kpi:hover::after{transform:scale(1.25)}
.kpi .k-top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);font-weight:600;letter-spacing:.02em}
.kpi .k-ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--kc,var(--brand-soft));color:var(--ki,var(--brand))}
.kpi .k-val{font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:-.4px;margin-top:8px;position:relative}
.kpi .k-sub{font-size:11.5px;color:var(--ink2);margin-top:2px}
.k-val.pos{color:var(--up)} .k-val.neg{color:var(--down)}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
.page-head p{color:var(--ink2);font-size:13.5px;margin-top:3px}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{padding:6.5px 13px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink2);transition:all .15s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button:hover:not(.on){color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink2)}
.field label b{color:var(--down)}
.field input,.field select,.field textarea{padding:9.5px 12px;border:1px solid var(--line);border-radius:10px;
background:var(--surface);transition:border-color .15s, box-shadow .15s;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);outline:none}
.field textarea{resize:vertical;min-height:64px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.money-wrap{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;transition:border-color .15s,box-shadow .15s}
.money-wrap:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.money-wrap span{padding:0 4px 0 12px;color:var(--ink2);font-weight:600;font-size:13.5px}
.money-wrap input{border:none!important;box-shadow:none!important;flex:1;padding:9.5px 12px 9.5px 4px;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;background:transparent}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3.5px 10px;border-radius:99px;font-size:11.5px;font-weight:600}
.badge{padding:3.5px 10px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.02em}
.badge.pago{background:var(--up-soft);color:var(--up)}
.badge.pendente{background:var(--warn-soft);color:var(--warn)}
.badge.vencido{background:var(--down-soft);color:var(--down)}
.progress{height:9px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.progress i{display:block;height:100%;border-radius:99px;background:var(--pc,var(--brand));width:0;transition:width .8s cubic-bezier(.3,.9,.3,1)}
.progress.over i{background:var(--down)}
.table-wrap{overflow-x:auto;padding:0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);
padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--surface2)}
tbody tr:last-child td{border-bottom:none}
.td-main{font-weight:600}
.td-sub{font-size:11.5px;color:var(--ink2);font-weight:400;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row-actions{display:flex;gap:2px;justify-content:flex-end;opacity:.35;transition:opacity .15s}
tr:hover .row-actions{opacity:1}
@media (hover:none){.row-actions{opacity:1}}
.val-up{color:var(--up);font-weight:700} .val-down{color:var(--down);font-weight:700}
.table-foot{display:flex;gap:22px;padding:13px 16px;border-top:1px solid var(--line);font-size:13px;flex-wrap:wrap}
.table-foot b{font-variant-numeric:tabular-nums}
.empty{padding:46px 20px;text-align:center;color:var(--ink2)}
.empty .e-art{width:74px;height:74px;margin:0 auto 16px;border-radius:22px;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand)}
.empty h4{font-family:var(--disp);color:var(--ink);font-size:16px;margin-bottom:5px}
.empty p{font-size:13px;max-width:340px;margin:0 auto 16px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 16px;margin-bottom:16px}
.filters input,.filters select{padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:13px}
.filters input[type=search]{flex:1;min-width:170px}
.filters input:focus,.filters select:focus{border-color:var(--brand);outline:none}
.cc-grid{grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr))}
.cc-visual{border-radius:16px;padding:18px;color:#fff;position:relative;overflow:hidden;min-height:150px;
display:flex;flex-direction:column;justify-content:space-between;margin-bottom:14px;
background:linear-gradient(135deg,var(--cc,#0e6b4f) 0%, color-mix(in srgb,var(--cc,#0e6b4f) 55%, #04120d) 130%);
box-shadow:0 14px 28px -12px color-mix(in srgb,var(--cc,#0e6b4f) 70%, transparent)}
.cc-visual::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.09);right:-70px;top:-90px}
.cc-visual::after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.06);right:30px;bottom:-70px}
.cc-chip{width:36px;height:27px;border-radius:6px;background:linear-gradient(135deg,#f4d58d,#d9a441);position:relative}
.cc-chip::after{content:"";position:absolute;inset:6px 5px;border:1px solid rgba(0,0,0,.25);border-radius:3px}
.cc-name{font-family:var(--disp);font-weight:700;font-size:17px}
.cc-bank{font-size:12px;opacity:.75}
.cc-num{letter-spacing:.22em;font-size:12px;opacity:.65}
.chart-box svg{width:100%;height:auto;display:block}
.bar-anim{transform:scaleY(0);transform-origin:bottom;animation:grow .7s cubic-bezier(.3,.9,.35,1) forwards}
@keyframes grow{to{transform:scaleY(1)}}
.donut-seg{transition:stroke-dashoffset .9s cubic-bezier(.3,.9,.3,1)}
.legend{display:flex;flex-direction:column;gap:9px;font-size:13px}
.legend .lg-row{display:flex;align-items:center;gap:9px}
.legend .lg-dot{width:11px;height:11px;border-radius:4px;flex-shrink:0}
.legend .lg-val{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.legend .lg-pct{color:var(--ink2);font-size:12px;width:44px;text-align:right}
.bill-group h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin:22px 0 10px;display:flex;gap:8px;align-items:center}
.bill-group h4 .count{background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:11px}
.bill{display:flex;align-items:center;gap:14px;padding:13px 16px;background:var(--surface);border:1px solid var(--line);
border-radius:13px;margin-bottom:8px;transition:transform .15s, box-shadow .15s}
.bill:hover{transform:translateX(3px);box-shadow:var(--shadow)}
.bill .b-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
.bill .b-mid{flex:1;min-width:0}
.bill .b-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.bill .b-sub{font-size:12px;color:var(--ink2);display:block}
.bill .b-val{font-weight:800;font-family:var(--disp);font-size:15px;white-space:nowrap}
#modal-root .overlay{position:fixed;inset:0;background:rgba(10,22,17,.55);backdrop-filter:blur(4px);
z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:0;opacity:0;transition:opacity .2s}
#modal-root .overlay.show{opacity:1}
.modal{background:var(--surface);width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;
border-radius:20px 20px 0 0;box-shadow:var(--shadow-lg);transform:translateY(24px);transition:transform .25s cubic-bezier(.3,.9,.3,1)}
.overlay.show .modal{transform:none}
.modal.wide{max-width:760px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 0}
.modal-h h3{font-size:18px;font-weight:800;letter-spacing:-.3px}
.modal-b{padding:18px 22px;overflow-y:auto}
.modal-f{padding:14px 22px 20px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);flex-wrap:wrap}
@media (min-width:640px){
#modal-root .overlay{align-items:center;padding:20px}
.modal{border-radius:20px;transform:scale(.96) translateY(10px)}
.overlay.show .modal{transform:none}
}
#toast-root{position:fixed;top:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
border-left:4px solid var(--brand);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow-lg);
font-size:13.5px;font-weight:600;min-width:250px;max-width:calc(100vw - 36px);animation:toastIn .3s cubic-bezier(.3,1.2,.4,1)}
.toast.err{border-left-color:var(--down)} .toast.warn{border-left-color:var(--warn)}
.toast .ic{flex-shrink:0}
@keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .25s forwards}
@keyframes toastOut{to{opacity:0;transform:translateX(30px)}}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quick-item{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 12px;border:1px solid var(--line);
border-radius:15px;background:var(--surface2);font-weight:600;font-size:13px;transition:all .18s;text-align:center}
.quick-item:hover{border-color:var(--brand);background:var(--brand-soft);transform:translateY(-3px)}
.quick-item .qi{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--surface);color:var(--brand);box-shadow:var(--shadow)}
#onboard{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;
background:linear-gradient(150deg,#0b2b21 0%,#0e4433 60%,#0c5a42 130%)}
#onboard::before{content:"";position:absolute;inset:0;background:
radial-gradient(600px 400px at 80% 10%, rgba(31,196,141,.25), transparent 60%),
radial-gradient(500px 400px at 10% 90%, rgba(217,142,31,.14), transparent 55%)}
.ob-card{position:relative;max-width:640px;color:#eaf5ef;text-align:center}
.ob-card .brand-mark{width:64px;height:64px;border-radius:20px;margin:0 auto 22px;font-size:30px}
.ob-card h1{font-size:clamp(30px,5vw,44px);font-weight:800;letter-spacing:-1px;line-height:1.1}
.ob-card h1 em{font-style:normal;color:#3ee0a6}
.ob-card p{margin:16px auto 30px;max-width:460px;color:#b9d6c8;font-size:15px}
.ob-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.ob-note{margin-top:26px;font-size:12px;color:#7fa393}
.hero-balance{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:24px 26px;position:relative;overflow:hidden;
background:linear-gradient(120deg,var(--side) 0%, #0e4433 90%);color:#fff;border:none}
.hero-balance::before{content:"";position:absolute;inset:0;background:radial-gradient(420px 200px at 88% 0%, rgba(62,224,166,.28), transparent 60%)}
.hero-balance .hb-label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#8fbfa9;font-weight:600}
.hero-balance .hb-val{font-family:var(--disp);font-size:clamp(30px,4.4vw,42px);font-weight:800;letter-spacing:-1px;line-height:1.1;margin-top:4px}
.hero-balance .hb-side{margin-left:auto;display:flex;gap:26px;flex-wrap:wrap;position:relative}
.hb-item{font-size:12.5px;color:#b9d6c8}
.hb-item b{display:block;font-size:17px;color:#fff;font-family:var(--disp)}
.hb-item b.pos{color:#3ee0a6}.hb-item b.neg{color:#ff9b9b}
.cat-dot{width:26px;height:26px;border-radius:8px;display:inline-grid;place-items:center;color:#fff;flex-shrink:0}
.divider{height:1px;background:var(--line);margin:18px 0}
.hint{font-size:12px;color:var(--ink2);display:flex;gap:7px;align-items:flex-start;padding:10px 12px;background:var(--surface2);border-radius:10px;border:1px solid var(--line)}
.toggle-row{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px dashed var(--line2);border-radius:11px;margin-bottom:12px;cursor:pointer;transition:all .15s;font-size:13.5px;font-weight:600}
.toggle-row:hover{border-color:var(--brand);background:var(--brand-soft)}
.toggle-row.on{border-style:solid;border-color:var(--brand);background:var(--brand-soft)}
.reveal{display:none;animation:viewIn .25s ease}
.reveal.open{display:block}
.stat-strip{display:flex;gap:26px;flex-wrap:wrap;padding:16px 20px}
.stat-strip .ss b{font-family:var(--disp);font-size:19px;display:block}
.stat-strip .ss span{font-size:12px;color:var(--ink2)}
.settings-grid{grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr));align-items:start}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:none}
.set-row .sr-t{font-weight:600;font-size:14px}
.set-row .sr-d{font-size:12px;color:var(--ink2)}
.set-row select{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.icon-pick,.color-pick{display:flex;flex-wrap:wrap;gap:7px}
.icon-pick button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;background:var(--surface);color:var(--ink2);transition:all .12s}
.icon-pick button:hover{transform:translateY(-2px)}
.icon-pick button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.color-pick button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;transition:transform .12s}
.color-pick button:hover{transform:scale(1.15)}
.color-pick button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface)}
.invoice-block{border:1px solid var(--line);border-radius:13px;margin-bottom:12px;overflow:hidden}
.invoice-block .ib-h{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--surface2);font-size:13px;font-weight:700}
.invoice-block .ib-h .ib-total{margin-left:auto;font-family:var(--disp)}
.inv-row{display:flex;align-items:center;gap:10px;padding:9px 14px;font-size:13px;border-top:1px solid var(--line)}
.inv-row .iv-d{color:var(--ink2);font-size:12px;width:78px;flex-shrink:0}
.inv-row .iv-n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#scrim{position:fixed;inset:0;background:rgba(8,20,15,.5);z-index:59;opacity:0;pointer-events:none;transition:opacity .25s}
@media (max-width:960px){
#sidebar{transform:translateX(-105%)}
#sidebar.open{transform:none;box-shadow:var(--shadow-lg)}
#scrim.on{opacity:1;pointer-events:auto}
#main{margin-left:0}
#btn-menu{display:inline-grid}
#fab{display:grid}
#btn-new-top{display:none}
.kpis{grid-template-columns:repeat(2,1fr)!important}
.charts-2{grid-template-columns:1fr!important}
}
@media (max-width:640px){
#view{padding:18px 14px 100px}
#topbar{padding:10px 14px}
#page-title{display:none}
.grid2{grid-template-columns:1fr}
.kpis{grid-template-columns:1fr 1fr!important;gap:10px}
.kpi .k-val{font-size:18px}
.hero-balance{padding:20px 18px}
.hero-balance .hb-side{margin-left:0;width:100%;gap:16px}
.bill{flex-wrap:wrap;gap:10px;padding:12px 14px}
.bill .b-mid{flex:1 1 170px}
.bill .b-val{margin-left:auto}
.bill .row-actions{width:100%;justify-content:flex-end}
.modal-f{padding:14px 16px 18px}
.modal-f .btn{flex:1 1 auto}
.modal-h,.modal-b{padding-left:16px;padding-right:16px}
.invoice-block .ib-h{flex-wrap:wrap}
.inv-row{flex-wrap:wrap}
.inv-row .iv-d{width:auto}
table.responsive thead{display:none}
table.responsive, table.responsive tbody, table.responsive tr, table.responsive td{display:block;width:100%}
table.responsive tr{border:1px solid var(--line);border-radius:13px;margin:10px;background:var(--surface);box-shadow:var(--shadow);padding:6px 0;width:auto}
table.responsive td{border:none;padding:6px 14px;display:flex;justify-content:space-between;gap:12px;text-align:right}
table.responsive td::before{content:attr(data-label);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:700;text-align:left}
table.responsive td.td-first{padding-top:12px}
table.responsive .row-actions{justify-content:flex-end;opacity:1;padding-bottom:10px}
table.responsive .row-actions::before{display:none}
.filters{flex-direction:column;align-items:stretch}
}
.charts-2{grid-template-columns:1.6fr 1fr}
@media (min-width:961px) and (max-width:1150px){.charts-2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){
*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
@media print{
#sidebar,#topbar,#fab,#toast-root,#modal-root,#scrim{display:none!important}
body{background:#fff}
#main{margin:0}
#view{padding:0;max-width:none}
.card{box-shadow:none;border-color:#ccc;break-inside:avoid}
.no-print{display:none!important}
}

<script>
"use strict";
/* ---------- 1. Utilitários ---------- */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const APP_ID = "fluxo";
const DB_KEY = "fluxo.v1";
const AUTO_KEY = "fluxo.autobackup";
const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const MESES3 = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, "0");
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromISO = s => { const [a,b,c] = String(s).split("-").map(Number); return new Date(a, b-1, c); };
const todayISO = () => isoOf(new Date());
const validDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(fromISO(s).getTime());
const addDays = (iso, n) => { const d = fromISO(iso); d.setDate(d.getDate()+n); return isoOf(d); };
const addMonths = (iso, n) => {
const d = fromISO(iso), day = d.getDate();
d.setDate(1); d.setMonth(d.getMonth()+n);
const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
d.setDate(Math.min(day, last)); return isoOf(d);
};
const monthKey = iso => String(iso).slice(0, 7);
const daysBetween = (a, b) => Math.round((fromISO(b) - fromISO(a)) / 86400000);
const labShort = iso => `${String(iso).slice(8,10)} ${MESES3[+String(iso).slice(5,7)-1]}/${String(iso).slice(2,4)}`;
let _fmtCache = {};
function fmtMoney(cents){
const cur = state.settings.currency || "BRL";
if(!_fmtCache[cur]) _fmtCache[cur] = new Intl.NumberFormat("pt-BR", {style:"currency", currency:cur});
return _fmtCache[cur].format((cents||0)/100);
}
function fmtShort(cents){
const v = (cents||0)/100, a = Math.abs(v);
if(a >= 1e6) return (v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1}) + "M";
if(a >= 1e3) return (v/1e3).toLocaleString("pt-BR",{maximumFractionDigits: a<1e4?1:0}) + "k";
return v.toLocaleString("pt-BR",{maximumFractionDigits:0});
}
function fmtDate(iso){
if(!validDate(iso)) return "—";
const [y,m,d] = String(iso).split("-");
const f = state.settings.dateFormat || "dd/mm/aaaa";
if(f === "aaaa-mm-dd") return iso;
if(f === "mm/dd/aaaa") return `${m}/${d}/${y}`;
return `${d}/${m}/${y}`;
}
const fmtDateShort = iso => validDate(iso) ? `${String(iso).slice(8,10)} ${MESES3[+String(iso).slice(5,7)-1]}` : "—";
function download(name, content, mime){
const b = new Blob([content], {type: mime});
const u = URL.createObjectURL(b);
const a = document.createElement("a");
a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
setTimeout(()=>URL.revokeObjectURL(u), 800);
}
/* ---------- 2. Estado e armazenamento ---------- */
const PAY_METHODS = ["Pix","Dinheiro","Cartão de débito","Cartão de crédito","Boleto","Transferência","Débito automático","Outro"];
const ACC_TYPES = {corrente:"Conta corrente", poupanca:"Poupança", dinheiro:"Dinheiro", digital:"Carteira digital", investimento:"Investimentos", outra:"Outra"};
const PALETTE = ["#e8590c","#1971c2","#f08c00","#e03131","#7048e8","#d6336c","#0ca678","#4c6ef5","#5f3dc4","#b08968","#2f9e44","#8d99ae","#12b886","#f59f00"];
function defaultState(){
const C = (name,type,icon,color)=>({id:uid(),name,type,icon,color});
return {
meta:{app:APP_ID, version:1, createdAt:new Date().toISOString()},
settings:{currency:"BRL", dateFormat:"dd/mm/aaaa", theme:"light", monthStart:1},
categories:[
C("Alimentação","despesa","utensils","#e8590c"), C("Moradia","despesa","home","#1971c2"),
C("Transporte","despesa","car","#f08c00"), C("Saúde","despesa","heart","#e03131"),
C("Educação","despesa","book","#7048e8"), C("Lazer","despesa","ticket","#d6336c"),
C("Compras","despesa","bag","#0ca678"), C("Assinaturas","despesa","repeat","#4c6ef5"),
C("Contas","despesa","receipt","#5f3dc4"), C("Impostos","despesa","landmark","#b08968"),
C("Outros","despesa","dots","#8d99ae"),
C("Salário","receita","briefcase","#2f9e44"), C("Freelance","receita","sparkles","#12b886"),
C("Vendas","receita","tag","#f59f00"), C("Investimentos","receita","trendUp","#37b24d"),
C("Outros","receita","coins","#74c69d")
],
accounts:[], cards:[], transactions:[], recurrences:[],
budgets:{monthly:0, categories:{}},
goals:{saveMonthly:0, netWorth:0},
demo:false, initialized:false
};
}
let state = loadState() || defaultState();
const ui = { period:"mes", from:"", to:"", txF:{q:"",type:"",cat:"",acc:"",status:"",method:"",from:"",to:"",sort:"date-desc",_focus:false} };
function loadState(){
try{
const raw = localStorage.getItem(DB_KEY);
if(!raw) return null;
const d = JSON.parse(raw);
if(d && d.meta && d.meta.app === APP_ID) return mergeDefaults(d);
}catch(e){ console.warn("Falha ao ler dados locais", e); }
return null;
}
function mergeDefaults(d){
const base = defaultState();
const out = {...base, ...d, settings:{...base.settings, ...(d.settings||{})},
budgets:{...base.budgets, ...(d.budgets||{})}, goals:{...base.goals, ...(d.goals||{})}};
["categories","accounts","cards","transactions","recurrences"].forEach(k=>{ if(!Array.isArray(out[k])) out[k]=[]; });
return out;
}
function save(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(state)); }catch(e){ toast("Não foi possível salvar (armazenamento cheio?).", "err"); } }
/* ---------- 3. Derivados, períodos e cálculos ---------- */
const catById  = id => state.categories.find(c=>c.id===id);
const accById  = id => state.accounts.find(a=>a.id===id);
const cardById = id => state.cards.find(c=>c.id===id);
function txStatus(t){ if(t.status === "pago") return "pago"; return t.date < todayISO() ? "vencido" : "pendente"; }
function accountBalance(acc){
let b = acc.initial || 0;
for(const t of state.transactions) if(t.status==="pago" && t.accountId===acc.id) b += t.type==="receita" ? t.value : -t.value;
return b;
}
const netWorth = () => state.accounts.reduce((s,a)=>s+accountBalance(a), 0);
const invested = () => state.accounts.filter(a=>a.type==="investimento"||a.type==="poupanca").reduce((s,a)=>s+Math.max(0,accountBalance(a)),0);
function rangeForPeriod(p, from, to){
const t = new Date(), ms = Math.min(Math.max(+state.settings.monthStart||1,1),28);
const cycle = anchor => {
const s = new Date(anchor.getFullYear(), anchor.getMonth(), ms);
if(anchor < s) s.setMonth(s.getMonth()-1);
const e = new Date(s.getFullYear(), s.getMonth()+1, ms-1);
return [isoOf(s), isoOf(e)];
};
if(p==="prev"){ const [cs]=cycle(t); return cycle(fromISO(addDays(cs,-1))); }
if(p==="mes")  return cycle(t);
if(p==="30d")  return [todayISO(), addDays(todayISO(),30)];
if(p==="ano")  return [`${t.getFullYear()}-01-01`, `${t.getFullYear()}-12-31`];
if(p==="custom"){ let f=from||`${t.getFullYear()}-01-01`, g=to||todayISO(); if(f>g){ const tmp=f; f=g; g=tmp; } return [f,g]; }
return cycle(t);
}
function periodRange(){ return rangeForPeriod(ui.period, ui.from, ui.to); }
const inRange = (d,s,e) => d>=s && d<=e;
function lastMonths(n){
const out=[], d=new Date();
for(let i=n-1;i>=0;i--){ const x=new Date(d.getFullYear(), d.getMonth()-i, 1);
out.push({key:`${x.getFullYear()}-${pad(x.getMonth()+1)}`, label:`${MESES3[x.getMonth()]}/${String(x.getFullYear()).slice(2)}`}); }
return out;
}
function monthsInRange(ps,pe){
const out=[]; let y=+ps.slice(0,4), m=+ps.slice(5,7);
const ey=+pe.slice(0,4), em=+pe.slice(5,7); let guard=0;
while((y<ey || (y===ey && m<=em)) && guard++<24){
out.push({key:`${y}-${pad(m)}`, label:`${MESES3[m-1]}/${String(y).slice(2)}`});
m++; if(m>12){m=1;y++;}
}
return out;
}
function cycleRange(anchor){
const ms = Math.min(Math.max(+state.settings.monthStart||1,1),28);
const s = new Date(anchor.getFullYear(), anchor.getMonth(), ms);
if(anchor < s) s.setMonth(s.getMonth()-1);
const e = new Date(s.getFullYear(), s.getMonth()+1, ms-1);
return [isoOf(s), isoOf(e)];
}
function cardStats(card){
const inst = state.transactions.filter(t=>t.cardId===card.id && t.type==="despesa");
const open = inst.filter(t=>t.status!=="pago");
const used = open.reduce((s,t)=>s+t.value,0);
const now = todayISO(), mk = monthKey(now);
const invoiceNow = inst.filter(t=>monthKey(t.date)===mk).reduce((s,t)=>s+t.value,0);
const overdue = open.filter(t=>t.date<now).reduce((s,t)=>s+t.value,0);
return {used, open:open.length, invoiceNow, overdue, available:(card.limit||0)-used};
}
/* ---------- 4. Recorrências e parcelas ---------- */
function advanceDate(iso, freq, every){
every = Math.max(1, +every||1);
if(freq==="mensal")  return addMonths(iso, every);
if(freq==="semanal") return addDays(iso, 7*every);
if(freq==="anual")   return addMonths(iso, 12*every);
return addDays(iso, every);
}
/* GERAÇÃO CORRIGIDA:
   - "count": gera exatamente as N ocorrências pedidas (sem limite de horizonte).
   - "date": gera até a data final escolhida.
   - "never": gera com horizonte amplo conforme a frequência. */
function materializeRecurrence(r){
if(!r.active) return;
const freq = r.freq || "mensal";
let horizon;
if(freq==="mensal")       horizon = addMonths(todayISO(), 12);
else if(freq==="anual")   horizon = addMonths(todayISO(), 24);
else                      horizon = addDays(todayISO(), 180); // semanal / dias
let guard = 0;
const MAXGEN = 1200; // trava de segurança
while(r.nextDate && guard++ < MAXGEN){
if(r.endMode==="date" && r.endDate && r.nextDate > r.endDate){ r.active=false; break; }
if(r.endMode==="count" && r.generated >= (r.count||0)){ r.active=false; break; }
if(r.endMode!=="date" && r.endMode!=="count" && r.nextDate > horizon){ break; }
state.transactions.push({
id:uid(), type:r.type, desc:r.desc, value:r.value, date:r.nextDate,
categoryId:r.categoryId, accountId:r.accountId||null, cardId:r.cardId||null,
payMethod:r.payMethod||"Pix", status:"pendente", note:r.note||"",
recurrenceId:r.id, recIndex:(r.generated||0)+1
});
r.nextDate = advanceDate(r.nextDate, r.freq, r.every);
r.generated = (r.generated||0)+1;
}
}
const materializeAll = () => state.recurrences.forEach(materializeRecurrence);
function createInstallments({type, desc, value, firstDate, n, categoryId, accountId, cardId, payMethod, note}){
const groupId = uid();
const base = Math.floor(value/n), rest = value - base*n;
for(let i=0;i<n;i++){
state.transactions.push({
id:uid(), type, desc, value: base + (i===0?rest:0), date: addMonths(firstDate, i),
categoryId, accountId: cardId ? null : accountId, cardId: cardId||null,
payMethod, status:"pendente", note:note||"", groupId, installment:i+1, installments:n
});
}
return groupId;
}
/* Agrupamentos usados na exclusão em massa */
const groupMates = t => t.groupId ? state.transactions.filter(x=>x.groupId===t.groupId) : [];
const recSiblings = t => t.recurrenceId ? state.transactions.filter(x=>x.recurrenceId===t.recurrenceId) : [];
/* ---------- 5. Ícones ---------- */
const ICONS = {
home:'<path d="M3 10.8 12 3.8l9 7"/><path d="M5.4 9.3V20h13.2V9.3"/><path d="M9.8 20v-5.4h4.4V20"/>',
receipt:'<path d="M6.5 3h11v18l-1.8-1.4-1.8 1.4-1.9-1.4L10.1 21l-1.8-1.4L6.5 21z"/><path d="M9.5 8h5M9.5 11.5h5M9.5 15h3"/>',
inbox:'<path d="M4.5 4.5h15l1.5 8v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5z"/><path d="M3 12.5h5.4l1.6 2.6h4l1.6-2.6H21"/>',
trendUp:'<path d="M3 17.5 9.4 11l4 4L21 7"/><path d="M14.8 7H21v6.2"/>',
trendDown:'<path d="M3 7l6.4 6.5 4-4L21 17"/><path d="M21 10.8V17h-6.2"/>',
creditCard:'<rect x="2.5" y="5.5" width="19" height="13.5" rx="2.5"/><path d="M2.5 10h19"/><path d="M6 15.5h4"/>',
bank:'<path d="M3 9.5 12 4l9 5.5"/><path d="M4.5 10v8M9.5 10v8M14.5 10v8M19.5 10v8"/><path d="M3 20.5h18"/>',
target:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.6"/><circle cx="12" cy="12" r="1" fill="currentColor"/>',
chart:'<path d="M4 20V10.5M9.3 20V4.5M14.6 20v-8.5M20 20V7.5"/><path d="M3 20.5h18"/>',
gear:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.2 5.2l1.9 1.9M16.9 16.9l1.9 1.9M18.8 5.2l-1.9 1.9M7.1 16.9l-1.9 1.9"/>',
search:'<circle cx="11" cy="11" r="6.6"/><path d="m20.5 20.5-4.8-4.8"/>',

function toast(msg, type="ok"){
const t = document.createElement("div");
t.className = "toast" + (type==="err" ? " err" : type==="warn" ? " warn" : "");
t.innerHTML = `${icon(type==="err"?"alert":type==="warn"?"info":"check",17)}<span>${esc(msg)}</span>`;
$("#toast-root").appendChild(t);
setTimeout(()=>{ t.classList.add("out"); setTimeout(()=>t.remove(), 260); }, 3200);
}
const modalStack=[];
function openModal({title, body, foot, wide, onClose}){
const root = $("#modal-root");
const ov = document.createElement("div");
ov.className = "overlay";
ov.innerHTML = `<div class="modal ${wide?"wide":""}" role="dialog" aria-modal="true">
<div class="modal-h"><h3>${title||""}</h3><button class="icon-btn" data-close aria-label="Fechar">${icon("x",17)}</button></div>
<div class="modal-b">${body}</div>
${foot?`<div class="modal-f">${foot}</div>`:""}
</div>`;
root.appendChild(ov);
requestAnimationFrame(()=>ov.classList.add("show"));
const close = ()=>{ const i=modalStack.indexOf(ov); if(i>-1) modalStack.splice(i,1);
ov.classList.remove("show"); setTimeout(()=>{ov.remove(); onClose&&onClose();}, 210); };
modalStack.push(ov);
ov.addEventListener("mousedown", e=>{ if(e.target===ov) close(); });
ov.querySelector("[data-close]").addEventListener("click", close);
ov._close = close;
return ov;
}

}

function moneyMask(el){
const fmt = c => (c/100).toLocaleString("pt-BR",{minimumFractionDigits:2, maximumFractionDigits:2});
const setC = c => { el.dataset.cents = String(c); el.value = fmt(c); };
el.setAttribute("inputmode","numeric"); el.setAttribute("autocomplete","off");
if(el.dataset.cents === undefined) setC(0); else el.value = fmt(+el.dataset.cents||0);
el.addEventListener("keydown", e=>{
if(e.ctrlKey || e.metaKey) return;
const c = +el.dataset.cents || 0;
if(/^[0-9]$/.test(e.key)){ e.preventDefault(); if(c < 99999999999) setC(c*10 + +e.key); }
else if(e.key==="Backspace" || e.key==="Delete"){ e.preventDefault(); setC(Math.floor(c/10)); }
else if(["Tab","Shift","ArrowLeft","ArrowRight","Home","End","Enter","Escape"].includes(e.key)) return;
else e.preventDefault();
});
el.addEventListener("paste", e=>{
e.preventDefault();
const digits = (e.clipboardData.getData("text")||"").replace(/\D/g,"").slice(0,11);
setC(+digits || 0);
});
el.addEventListener("focus", ()=> setTimeout(()=>el.select(), 30));
}
const getMoney = el => +el.dataset.cents || 0;
function setMoney(el, cents){ el.dataset.cents = String(cents||0); el.value = ((cents||0)/100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
const initMoney = root => (root||document).querySelectorAll("input.money").forEach(moneyMask);
const opt = (v,l,sel) => `<option value="${esc(v)}" ${sel?"selected":""}>${esc(l)}</option>`;
function catOptions(type, sel){ return state.categories.filter(c=>c.type===type).map(c=>opt(c.id,c.name,c.id===sel)).join(""); }
function accOptions(sel){ const ph = sel ? "" : `<option value="" selected>Selecionar…</option>`;
return ph + state.accounts.map(a=>opt(a.id, `${a.name} (${ACC_TYPES[a.type]||a.type})`, a.id===sel)).join(""); }
function cardOptions(sel){ return state.cards.filter(c=>c.active!==false || c.id===sel).map(c=>opt(c.id,c.name,c.id===sel)).join(""); }
function methodOptions(tp, cur){
const list = PAY_METHODS.filter(m => tp==="receita" ? m!=="Cartão de crédito" : true);
const selected = list.includes(cur) ? cur : (list[0] || "");
return list.map(m=>opt(m,m,m===selected)).join("");
}

/* ---------- 7. Gráficos ---------- */
function chartBars(months){
const W=640,H=235,P=34, max=Math.max(1,...months.flatMap(m=>[m.rec,m.desp]));
const gw=(W-P*2)/Math.max(1,months.length), bw=Math.min(26, gw*0.26);
let grid="";
for(let i=0;i<=4;i++){ const y=H-30-(H-60)*i/4, v=max*i/4;
grid += `<line x1="${P}" y1="${y}" x2="${W-P/2}" y2="${y}" stroke="var(--line)" stroke-dasharray="${i? '3 5':'0'}"/>
<text x="${P-6}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--ink2)">${fmtShort(v)}</text>`; }
const barRect = (x,h,fill,delay)=>{
if(h<=0) return "";
const hh = Math.max(2,h);
return `<rect class="bar-anim" x="${x}" y="${H-30-hh}" width="${bw}" height="${hh}" rx="5" fill="${fill}" style="animation-delay:${delay}ms"/>`;
};
const bars = months.map((m,i)=>{
const x=P+i*gw+gw/2;
const h1=(H-60)*m.rec/max, h2=(H-60)*m.desp/max;
return `<g><title>${esc(m.label)} — Receitas ${fmtMoney(m.rec)} · Despesas ${fmtMoney(m.desp)}</title>
${barRect(x-bw-2,h1,"var(--up)",i*50)}
${barRect(x+2,h2,"var(--down)",i*50+60)}
<text x="${x}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--ink2)">${esc(m.label)}</text></g>`;
}).join("");
return `<div class="chart-box"><svg viewBox="0 0 ${W} ${H}">${grid}${bars}
<g font-size="11" fill="var(--ink2)">
<circle cx="${W-150}" cy="14" r="5" fill="var(--up)"/><text x="${W-140}" y="18">Receitas</text>
<circle cx="${W-72}" cy="14" r="5" fill="var(--down)"/><text x="${W-62}" y="18">Despesas</text>
</g></svg></div>`;
}
function chartDonut(items){
const total = items.reduce((s,i)=>s+i.value,0);
if(!total) return `<div class="empty" style="padding:30px">${icon("chart",30)}<p style="margin-top:8px">Sem despesas no período.</p></div>`;
items = items.filter(i=>i.value>0).sort((a,b)=>b.value-a.value);
const top = items.slice(0,7), rest = items.slice(7).reduce((s,i)=>s+i.value,0);
const data = rest>0 ? [...top, {label:"Outras", value:rest, color:"#8d99ae"}] : top;
const r=62, C=2*Math.PI*r; let off=0;
const segs = data.map(d=>{
const len = C*d.value/total, s =
`<circle class="donut-seg" cx="100" cy="100" r="${r}" fill="none" stroke="${d.color}" stroke-width="26"
stroke-dasharray="${Math.max(0,len-2)} ${C-len+2}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)">
<title>${esc(d.label)}: ${fmtMoney(d.value)}</title></circle>`;
off += len; return s;
}).join("");
const legend = data.map(d=>`<div class="lg-row"><span class="lg-dot" style="background:${d.color}"></span>
<span>${esc(d.label)}</span><span class="lg-val">${fmtMoney(d.value)}</span>
<span class="lg-pct">${(100*d.value/total).toFixed(1)}%</span></div>`).join("");
return `<div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap">
<div class="chart-box" style="flex:0 0 200px"><svg viewBox="0 0 200 200">${segs}
<text x="100" y="95" text-anchor="middle" font-size="13" font-weight="800" fill="var(--ink)" font-family="var(--disp)">${fmtShort(total)}</text>
<text x="100" y="112" text-anchor="middle" font-size="10" fill="var(--ink2)">total gasto</text></svg></div>
<div class="legend" style="flex:1;min-width:210px">${legend}</div></div>`;
}
function chartArea(points){
if(points.length<2) return `<div class="empty" style="padding:30px">${icon("trendUp",30)}<p style="margin-top:8px">Sem pontos suficientes no período selecionado.</p></div>`;
const W=640,H=230,P=42;
const vals = points.map(p=>p.value), min=Math.min(...vals,0), max=Math.max(...vals,1), span=(max-min)||1;
const X=i=>P+(W-P-16)*i/(points.length-1), Y=v=>H-34-(H-64)*((v-min)/span);
let line=`M${X(0)} ${Y(points[0].value)}`;
for(let i=1;i<points.length;i++) line+=` L${X(i)} ${Y(points[i].value)}`;
const area = line + ` L${X(points.length-1)} ${H-34} L${X(0)} ${H-34} Z`;
const dots = points.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.value)}" r="4" fill="var(--brand)" stroke="var(--surface)" stroke-width="2">
<title>${esc(p.label)}: ${fmtMoney(p.value)}</title></circle>
<text x="${X(i)}" y="${H-12}" text-anchor="middle" font-size="10.5" fill="var(--ink2)">${esc(p.label)}</text>`).join("");
return `<div class="chart-box"><svg viewBox="0 0 ${W} ${H}">
<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="var(--brand)" stop-opacity=".30"/><stop offset="1" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs>
<line x1="${P}" y1="${Y(0)}" x2="${W-16}" y2="${Y(0)}" stroke="var(--line2)" stroke-dasharray="4 5"/>
<text x="${P-6}" y="${Y(max)+4}" text-anchor="end" font-size="10" fill="var(--ink2)">${fmtShort(max)}</text>
<text x="${P-6}" y="${Y(min)+4}" text-anchor="end" font-size="10" fill="var(--ink2)">${fmtShort(min)}</text>
<path d="${area}" fill="url(#ag)"/><path d="${line}" fill="none" stroke="var(--brand)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
${dots}</svg></div>`;
}
function balanceSeries(nMonths=8){
const deltas={};
state.transactions.filter(t=>t.status==="pago").forEach(t=>{
const k=monthKey(t.date); deltas[k]=(deltas[k]||0)+(t.type==="receita"?t.value:-t.value); });
let cum = state.accounts.reduce((s,a)=>s+(a.initial||0),0);
const keys = Object.keys(deltas).sort();
const pts = keys.map(k=>{ cum+=deltas[k]; return {label:`${MESES3[+k.slice(5,7)-1]}/${k.slice(2,4)}`, value:cum}; });
if(!pts.length) pts.push({label:labShort(todayISO()), value:cum});
pts.push({label:"Hoje", value:netWorth()});
return pts.slice(-nMonths);
}
function balanceSeriesForRange(ps,pe){
const paid = state.transactions.filter(t=>t.status==="pago" && t.date<=pe);
const base = state.accounts.reduce((s,a)=>s+(a.initial||0),0);
const valAt = d => { let v=base; for(const t of paid){ if(t.date<=d) v += t.type==="receita"?t.value:-t.value; } return v; };
const pts=[{label:labShort(ps), value:valAt(ps)}];
let y=+ps.slice(0,4), m=+ps.slice(5,7), guard=0;
while(guard++<24){
const end=isoOf(new Date(y,m,0));
if(end>ps && end<pe) pts.push({label:labShort(end), value:valAt(end)});
m++; if(m>12){m=1;y++;}
if(end>=pe) break;
}
if(pe>ps) pts.push({label:labShort(pe), value:valAt(pe)});
return pts;
}

<div class="toggle-row" id="tg-inst">${icon("copy",16)} Parcelar esta despesa <span style="margin-left:auto;font-size:11px;color:var(--ink2)">2x ou mais</span></div>
<div class="reveal" id="pn-inst"><div class="grid2">
<div class="field"><label>Nº de parcelas</label><select id="f-inst-n">${Array.from({length:119},(_,i)=>opt(i+2,(i+2)+"x",i===0)).join("")}</select></div>

</div><div class="hint">${icon("info",13)} Cada parcela vira um lançamento mensal. Ex.: R$ 1.200 em 12x gera 12 parcelas de R$ 100.</div></div>
<div class="toggle-row" id="tg-rec">${icon("repeat",16)} Repetir automaticamente <span style="margin-left:auto;font-size:11px;color:var(--ink2)">recorrência</span></div>
<div class="reveal" id="pn-rec"><div class="grid2">
<div class="field"><label>Frequência</label><select id="f-rec-freq">
${opt("mensal","Mensal",true)}${opt("semanal","Semanal")}${opt("anual","Anual")}${opt("dias","Personalizada (a cada X dias)")}</select></div>
<div class="field" id="w-every" style="display:none"><label>A cada quantos dias</label><input type="number" id="f-rec-every" min="1" max="365" value="15"></div>
<div class="field"><label>Termina quando?</label><select id="f-rec-end">${opt("never","Nunca termina")}${opt("date","Até a data")}${opt("count","Após N ocorrências")}</select></div>
<div class="field" id="w-enddate" style="display:none"><label>Data final</label><input type="date" id="f-rec-date"></div>
<div class="field" id="w-endcount" style="display:none"><label>Nº de ocorrências</label><input type="number" id="f-rec-count" min="1" value="12"></div>
</div></div>`}
</form>`,
foot: `<button class="btn btn-ghost" data-x>Cancelar</button><button class="btn btn-primary" data-save>${icon("check",15)} Salvar</button>`
});
const q = s => ov.querySelector(s);
initMoney(ov);
setMoney(q("#f-value"), edit?.value ?? (opts.value||0));
const _fId = q("#f-inst-d"); if(_fId) _fId.value = edit?.date || todayISO();
let status = edit?.status || (opts.status || "pendente");
if(status==="vencido") status="pendente";
const paintSeg = ()=>{
q("#tx-seg").querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.t===type));
const currentMethod = q("#f-method") ? q("#f-method").value : "Pix";
q("#f-cat").innerHTML = catOptions(type, edit?.categoryId);
q("#f-method").innerHTML = methodOptions(type, edit ? edit.payMethod : currentMethod);
const _tg = q("#tg-inst");
if(_tg){ _tg.style.display = type==="despesa" ? "flex" : "none";
if(type!=="despesa"){ q("#pn-inst").classList.remove("open"); _tg.classList.remove("on"); } }
};
const paintPay = ()=>{
const isCard = q("#f-method").value === "Cartão de crédito";
q("#w-card").style.display = isCard ? "" : "none";
q("#w-acc").style.display  = isCard ? "none" : "";
};
const paintStatus = ()=> q("#f-status").querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.s===status));
q("#tx-seg").onclick = e=>{ const b=e.target.closest("[data-t]"); if(b && !edit){ type=b.dataset.t; paintSeg(); paintPay(); } };
q("#f-method").onchange = paintPay;
q("#f-status").onclick = e=>{ const b=e.target.closest("[data-s]"); if(b){ status=b.dataset.s; paintStatus(); } };
if(q("#tg-inst")){
q("#tg-inst").onclick = ()=>{ q("#tg-inst").classList.toggle("on"); q("#pn-inst").classList.toggle("open");
if(q("#tg-inst").classList.contains("on")){ q("#tg-rec").classList.remove("on"); q("#pn-rec").classList.remove("open"); } };
q("#tg-rec").onclick = ()=>{ q("#tg-rec").classList.toggle("on"); q("#pn-rec").classList.toggle("open");
if(q("#tg-rec").classList.contains("on")){ q("#tg-inst").classList.remove("on"); q("#pn-inst").classList.remove("open"); } };
q("#f-rec-freq").onchange = ()=> q("#w-every").style.display = q("#f-rec-freq").value==="dias" ? "" : "none";
q("#f-rec-end").onchange = ()=>{ const v=q("#f-rec-end").value;
q("#w-enddate").style.display = v==="date"?"":"none"; q("#w-endcount").style.display = v==="count"?"":"none"; };
}
paintSeg();
if(opts.presetCard){ q("#f-method").value = "Cartão de crédito"; }
paintPay(); paintStatus();
const presetCardId = edit?.cardId || opts.cardId;
if(presetCardId && q("#f-card")) q("#f-card").value = presetCardId;
setTimeout(()=>q("#f-desc").focus(), 120);
q("[data-x]").onclick = ov._close;
q("#tx-form").onsubmit = e=>{ e.preventDefault(); q("[data-save]").click(); };
q("[data-save]").onclick = ()=>{
if(ov._saving) return;
const desc = q("#f-desc").value.trim();
const value = getMoney(q("#f-value"));
const date = q("#f-date").value;
const catId = q("#f-cat").value;
const method = q("#f-method").value;
const isCard = method === "Cartão de crédito";
const accId = isCard ? null : q("#f-acc").value;
const cardId = isCard ? q("#f-card").value : null;
const note = q("#f-note").value.trim();
if(!desc) return toast("Informe a descrição.", "err");
if(!value || value<=0) return toast("Informe um valor válido (maior que zero).", "err");
if(!validDate(date)) return toast("Informe uma data válida.", "err");
if(!catId || !catById(catId)) return toast("Escolha uma categoria válida.", "err");
if(!isCard && !accId) return toast("Escolha a conta (ou cadastre uma em Contas).", "err");
if(isCard && !cardId) return toast("Escolha o cartão (ou cadastre um em Cartões).", "err");
const useInst = q("#tg-inst") && q("#tg-inst").classList.contains("on") && type==="despesa";
const useRec  = q("#tg-rec")  && q("#tg-rec").classList.contains("on");
let recPlan = null, instPlan = null;
if(useRec){
const freq = q("#f-rec-freq").value, endMode = q("#f-rec-end").value;
if(endMode==="date" && !validDate(q("#f-rec-date").value)) return toast("Informe a data final da recorrência.", "err");
recPlan = {
freq,
endMode,
every: freq==="dias" ? Math.max(1,+q("#f-rec-every").value||1) : 1,
endDate: endMode==="date" ? q("#f-rec-date").value : null,
count: endMode==="count" ? Math.max(1,+q("#f-rec-count").value||1) : null
};
}
if(useInst){
const n = +q("#f-inst-n").value, fd = q("#f-inst-d").value;
if(!validDate(fd)) return toast("Informe a data da primeira parcela.", "err");
instPlan = {n, fd};
}
const saveBtn = q("[data-save]");
const beginSave = ()=>{ ov._saving = true; if(saveBtn) saveBtn.disabled = true; };
const cancelSave = ()=>{ ov._saving = false; if(saveBtn) saveBtn.disabled = false; };
const commit = (pickAcc)=>{
if(ov._saving) return;
beginSave();
const finalAcc = isCard ? (pickAcc || (edit ? edit.accountId : null)) : accId;
if(edit){
Object.assign(edit, {type, desc, value, date, categoryId:catId, accountId:finalAcc, cardId, payMethod:method, status, note});
save(); ov._close(); render(); return toast("Lançamento atualizado.");
}
if(useRec){
state.recurrences.push({
id:uid(), type, desc, value, categoryId:catId, accountId:accId, cardId, payMethod:method,
freq:recPlan.freq, every:recPlan.every, start:date, nextDate:date,
endMode:recPlan.endMode, endDate:recPlan.endDate, count:recPlan.count,
note, active:true, generated:0
});
materializeAll(); save(); ov._close(); render();
return toast("Recorrência criada e lançamentos futuros gerados.");
}
if(useInst){
const gid = createInstallments({type, desc, value, firstDate:instPlan.fd, n:instPlan.n, categoryId:catId, accountId:accId, cardId, payMethod:method, note});
if(status==="pago" && finalAcc){ state.transactions.forEach(t=>{ if(t.groupId===gid){ t.status="pago"; t.accountId=finalAcc; t.paidDate=todayISO(); } }); }
save(); ov._close(); render();
return toast(`${instPlan.n} parcelas geradas (${fmtMoney(Math.round(value/instPlan.n))} cada).`);
}
state.transactions.push({id:uid(), type, desc, value, date, categoryId:catId, accountId:finalAcc, cardId, payMethod:method, status, note,
paidDate: status==="pago" ? todayISO() : undefined});
save(); ov._close(); render();
return toast(type==="receita" ? "Receita adicionada." : "Despesa adicionada.");
};
const paidCardPick = status==="pago" && isCard && !(edit && edit.accountId);
if(paidCardPick){
beginSave();
if(!state.accounts.length){ cancelSave(); return toast("Cadastre uma conta para pagar este lançamento.", "err"); }
accountPickModal(id=>{ cancelSave(); commit(id); }, "Pagar com qual conta?", ()=>{ cancelSave(); });
return;
}
commit(null);
};
}
function openRecurrenceModal(rec){

const type = rec?.type || "receita";
const ov = openModal({

body:`<form id="rec-form">

</div>
<div class="grid2">

<div class="field" id="rw-every" style="display:none"><label>A cada X dias</label><input type="number" id="r-every" min="1" value="${rec?.every||15}"></div>
<div class="field"><label>Término</label><select id="r-end">${opt("never","Nunca termina",!rec||rec.endMode==="never")}${opt("date","Até a data",rec?.endMode==="date")}${opt("count","Após N ocorrências",rec?.endMode==="count")}</select></div>
<div class="field" id="rw-date" style="display:none"><label>Data final</label><input type="date" id="r-date" value="${rec?.endDate||""}"></div>

});
const q = s=>ov.querySelector(s);
initMoney(ov); setMoney(q("#r-value"), rec?.value||0);
let curType = type;
const paintCat = ()=> q("#r-cat").innerHTML = catOptions(curType, rec?.categoryId);
const paintPay = ()=>{ const isC=q("#r-method").value==="Cartão de crédito";
q("#rw-card").style.display=isC?"":"none"; q("#rw-acc").style.display=isC?"none":""; };
const paintMethod = ()=>{
const current = q("#r-method").value;
q("#r-method").innerHTML = methodOptions(curType, current);
paintPay();
};
const paintEnd = ()=>{ const v=q("#r-end").value;
q("#rw-date").style.display=v==="date"?"":"none"; q("#rw-count").style.display=v==="count"?"":"none";
q("#rw-every").style.display=q("#r-freq").value==="dias"?"":"none"; };
q("#r-type").onchange=()=>{curType=q("#r-type").value; paintCat(); paintMethod();};
q("#r-method").onchange=paintPay; q("#r-end").onchange=paintEnd; q("#r-freq").onchange=paintEnd;
paintCat(); paintMethod(); paintEnd();
q("[data-x]").onclick=ov._close;
q("#rec-form").onsubmit=e=>{e.preventDefault();q("[data-save]").click();};
q("[data-save]").onclick=()=>{
const desc=q("#r-desc").value.trim(), value=getMoney(q("#r-value")), start=q("#r-start").value;
const catId=q("#r-cat").value, method=q("#r-method").value, isC=method==="Cartão de crédito";
const freq=q("#r-freq").value, endMode=q("#r-end").value;
if(!desc) return toast("Informe a descrição.","err");
if(!value||value<=0) return toast("Informe um valor válido.","err");
if(!validDate(start)) return toast("Informe a data da primeira ocorrência.","err");
if(!catId) return toast("Escolha uma categoria.","err");
if(endMode==="date" && !validDate(q("#r-date").value)) return toast("Informe a data final.","err");
if(isC && !q("#r-card").value) return toast("Escolha o cartão (ou cadastre um em Cartões).","err");
if(!isC && !q("#r-acc").value) return toast("Escolha a conta (ou cadastre uma em Contas).","err");
if(ov._saving) return;
ov._saving=true;
const saveBtn=q("[data-save]"); if(saveBtn) saveBtn.disabled=true;
const data={type:curType,desc,value,categoryId:catId,payMethod:method,
accountId:isC?null:q("#r-acc").value, cardId:isC?q("#r-card").value:null,
freq, every:freq==="dias"?Math.max(1,+q("#r-every").value||1):1,
endMode, endDate:endMode==="date"?q("#r-date").value:null,
count:endMode==="count"?Math.max(1,+q("#r-count").value||1):null, note:q("#r-note").value.trim()};
if(edit){
const oldStart = rec.start;
Object.assign(rec,data);
if(oldStart!==start){
state.transactions = state.transactions.filter(t=>!(t.recurrenceId===rec.id && t.date>=todayISO()));
rec.nextDate=start; rec.generated=0;
}
materializeRecurrence(rec);
} else {
state.recurrences.push({id:uid(), active:true, generated:0, nextDate:start, start, ...data});
materializeAll();
}
save(); ov._close(); render(); toast(edit?"Recorrência atualizada.":"Recorrência criada.");
};
}
function openCategoryModal(cat){
const edit=!!cat;
const ov=openModal({title:edit?"Editar categoria":"Nova categoria", body:`

<button type="button" data-t="despesa">Despesa</button><button type="button" data-t="receita">Receita</button></div></div>
<div class="field"><label>Ícone</label><div class="icon-pick" id="c-icons">${
Object.keys(ICONS).filter(k=>!["menu","x","chevL","chevR","chevD","filter","printer","shield"].includes(k))
.map(k=>`<button type="button" data-i="${k}" title="${k}">${icon(k,17)}</button>`).join("")}</div></div>
<div class="field"><label>Cor</label><div class="color-pick" id="c-colors">${PALETTE.map(c=>`<button type="button" data-c="${c}" style="background:${c}"></button>`).join("")}</div></div>`,

<button class="btn btn-ghost" data-x>Cancelar</button><button class="btn btn-primary" data-save>${icon("check",15)} Salvar</button>`});
const q=s=>ov.querySelector(s);
let t=cat?.type||"despesa", ic=cat?.icon||"dots", co=cat?.color||PALETTE[0];
const paint=()=>{
q("#c-type").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
q("#c-icons").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.i===ic));
q("#c-colors").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.c===co));};

q("#c-icons").onclick=e=>{const b=e.target.closest("[data-i]"); if(b){ic=b.dataset.i;paint();}};
q("#c-colors").onclick=e=>{const b=e.target.closest("[data-c]"); if(b){co=b.dataset.c;paint();}};
paint();
q("[data-x]").onclick=ov._close;
const _del=q("[data-del]");
if(_del) _del.onclick=()=>{
const used=state.transactions.some(x=>x.categoryId===cat.id)||state.recurrences.some(x=>x.categoryId===cat.id);

confirmModal({title:"Excluir categoria", danger:true, okLabel:"Excluir",
msg:`Excluir a categoria <b>${esc(cat.name)}</b>?`,
onOk:()=>{ delete state.budgets.categories[cat.id];
state.categories=state.categories.filter(x=>x.id!==cat.id);
save(); ov._close(); render(); toast("Categoria excluída."); }});
};
q("[data-save]").onclick=()=>{
const name=q("#c-name").value.trim();
if(!name) return toast("Informe o nome.","err");
if(state.categories.some(c=>c.name.toLowerCase()===name.toLowerCase() && c.type===t && c.id!==cat?.id))
return toast("Já existe uma categoria com esse nome.","err");
if(ov._saving) return;
ov._saving=true;
const saveBtn=q("[data-save]"); if(saveBtn) saveBtn.disabled=true;
if(edit) Object.assign(cat,{name,icon:ic,color:co});
else state.categories.push({id:uid(),name,type:t,icon:ic,color:co});
save(); ov._close(); render(); toast(edit?"Categoria atualizada.":"Categoria criada.");
};
}

function payTransaction(t){
const refreshCardModals=()=>modalStack.forEach(o=>{ if(o.dataset.cardDetail&&o._refresh) o._refresh(); });
const doPay=accId=>{ if(accId) t.accountId=accId;
t.status="pago"; t.paidDate=todayISO(); save(); render(); refreshCardModals(); toast("Marcado como pago."); };
if(t.status==="pago"){ t.status="pendente"; delete t.paidDate; save(); render(); refreshCardModals(); return toast("Voltou para pendente.","warn"); }
if(t.cardId && !t.accountId) return accountPickModal(doPay, "Pagar com qual conta?");
doPay();
}
/* EXCLUSÃO CORRIGIDA — agora com opções em massa:
   • Parcelamento (compra parcelada): só esta / esta e as próximas / todas.
   • Recorrência (repetir automaticamente): só esta / esta e as próximas / todas + parar.
   • Lançamento comum: confirmação simples. */
function deleteTransaction(t){
const mates = groupMates(t);
const sib = recSiblings(t);
const rec = t.recurrenceId ? state.recurrences.find(r=>r.id===t.recurrenceId) : null;

/* ---------- Parcelamento ---------- */
if(t.groupId && mates.length>1){
const remaining = mates.filter(x=>(x.installment||0)>=(t.installment||0)).length;
const ov=openModal({title:"Excluir parcela", body:`
<p style="font-size:14px;line-height:1.6;color:var(--ink2)"><b style="color:var(--ink)">${esc(t.desc)}</b> — parcela ${t.installment}/${t.installments} de ${fmtMoney(t.value)}.</p>
<p style="font-size:13px;color:var(--ink2);margin-top:6px">Esta despesa é parcelada em <b>${mates.length}</b> lançamentos. O que deseja excluir?</p>`,
foot:`<button class="btn btn-ghost" data-x>Cancelar</button>
<button class="btn btn-ghost" data-one>${icon("trash",13)} Só esta</button>
<button class="btn btn-danger" data-from>Esta e as próximas (${remaining})</button>
<button class="btn btn-danger" data-all>Todas as ${mates.length}</button>`});
ov.querySelector("[data-x]").onclick=ov._close;
ov.querySelector("[data-one]").onclick=()=>{ov._close();
state.transactions=state.transactions.filter(x=>x.id!==t.id); save(); render(); toast("Parcela excluída.");};
ov.querySelector("[data-from]").onclick=()=>{ov._close();
confirmModal({title:"Excluir próximas parcelas",danger:true,okLabel:`Excluir ${remaining} parcela(s)`,
msg:`Excluir a parcela <b>${t.installment}</b> e as próximas de <b>${esc(t.desc)}</b>?<br>Essa ação não pode ser desfeita.`,
onOk:()=>{const ids=new Set(mates.filter(x=>(x.installment||0)>=(t.installment||0)).map(x=>x.id));
state.transactions=state.transactions.filter(x=>!ids.has(x.id)); save(); render(); toast(`${ids.size} parcela(s) excluída(s).`);}});};
ov.querySelector("[data-all]").onclick=()=>{ov._close();
confirmModal({title:"Excluir parcelamento completo",danger:true,okLabel:`Excluir todas (${mates.length})`,
msg:`Excluir <b>todas as ${mates.length} parcelas</b> de <b>${esc(t.desc)}</b> de uma só vez?<br>Essa ação não pode ser desfeita.`,
onOk:()=>{const ids=new Set(mates.map(x=>x.id));
state.transactions=state.transactions.filter(x=>!ids.has(x.id)); save(); render(); toast(`Parcelamento “${t.desc}” excluído por completo.`);}});};
return;
}

/* ---------- Recorrência ---------- */
if(t.recurrenceId && rec){
const future = sib.filter(x=>x.date>=t.date).length;
const ov=openModal({title:"Excluir lançamento recorrente", body:`
<p style="font-size:14px;line-height:1.6;color:var(--ink2)"><b style="color:var(--ink)">${esc(t.desc)}</b> (${fmtMoney(t.value)}) faz parte da recorrência <b style="color:var(--ink)">${esc(rec.desc)}</b> (${FREQ_LABEL[rec.freq]||rec.freq}).</p>
<p style="font-size:13px;color:var(--ink2);margin-top:6px">Há <b>${sib.length}</b> ocorrência(s) gerada(s). O que deseja fazer?</p>`,
foot:`<button class="btn btn-ghost" data-x>Cancelar</button>
<button class="btn btn-ghost" data-one>Só esta</button>
<button class="btn btn-danger" data-from>Esta e as próximas (${future})</button>
<button class="btn btn-danger" data-all>Todas (${sib.length}) + parar</button>`});
ov.querySelector("[data-x]").onclick=ov._close;
ov.querySelector("[data-one]").onclick=()=>{ov._close();
state.transactions=state.transactions.filter(x=>x.id!==t.id); save(); render(); toast("Ocorrência excluída.");};
ov.querySelector("[data-from]").onclick=()=>{ov._close();
confirmModal({title:"Excluir próximas ocorrências",danger:true,okLabel:`Excluir ${future} e parar`,
msg:`Excluir esta e as próximas ocorrências de <b>${esc(rec.desc)}</b> e interromper a geração automática?`,
onOk:()=>{const ids=new Set(sib.filter(x=>x.date>=t.date).map(x=>x.id));
state.transactions=state.transactions.filter(x=>!ids.has(x.id));
rec.active=false; rec.nextDate=null;
save(); render(); toast(`${ids.size} ocorrência(s) excluída(s); recorrência interrompida.`);}});};
ov.querySelector("[data-all]").onclick=()=>{ov._close();
confirmModal({title:"Excluir recorrência completa",danger:true,okLabel:`Excluir tudo (${sib.length})`,
msg:`Excluir <b>todas as ${sib.length} ocorrências</b> de <b>${esc(rec.desc)}</b> e remover a recorrência?<br>Elas não voltarão a ser geradas.`,
onOk:()=>{const ids=new Set(sib.map(x=>x.id));
state.transactions=state.transactions.filter(x=>!ids.has(x.id));
state.recurrences=state.recurrences.filter(r=>r.id!==rec.id);
save(); render(); toast(`Recorrência “${rec.desc}” excluída por completo.`);}});};
return;
}

/* ---------- Lançamento comum ---------- */
confirmModal({title:"Excluir lançamento", danger:true, okLabel:"Excluir",
msg:`Excluir <b>${esc(t.desc)}</b> (${fmtMoney(t.value)})?`,
onOk:()=>{ state.transactions=state.transactions.filter(x=>x.id!==t.id); save(); render(); toast("Lançamento excluído."); }});
}

function filteredTx(){
const f=ui.txF;
let list=[...state.transactions];
if(f.q){ const q=f.q.toLowerCase(); list=list.filter(t=> (t.desc+" "+(t.note||"")).toLowerCase().includes(q)); }
if(f.type) list=list.filter(t=>t.type===f.type);
if(f.cat) list=list.filter(t=>t.categoryId===f.cat);
if(f.acc) list=list.filter(t=>t.accountId===f.acc||t.cardId===f.acc);
if(f.status) list=list.filter(t=>txStatus(t)===f.status);
if(f.method) list=list.filter(t=>t.payMethod===f.method);
if(f.from) list=list.filter(t=>t.date>=f.from);
if(f.to) list=list.filter(t=>t.date<=f.to);
const S={ "date-desc":(a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id),
"date-asc":(a,b)=>a.date.localeCompare(b.date),
"val-desc":(a,b)=>b.value-a.value, "val-asc":(a,b)=>a.value-b.value,
"desc":(a,b)=>a.desc.localeCompare(b.desc,"pt-BR") };
return list.sort(S[f.sort]||S["date-desc"]);
}

function handleImportFile(file){
const rd=new FileReader();
rd.onerror=()=>toast("Arquivo inválido.","err");
rd.onload=()=>{
let obj;
try{ obj=JSON.parse(rd.result); }catch(e){ return toast("Arquivo inválido — não é um JSON válido.","err"); }
if(!obj || typeof obj!=="object" || !obj.meta || obj.meta.app!==APP_ID || !obj.data || !Array.isArray(obj.data.transactions))
return toast("Este backup não é compatível.","err");
const d=obj.data;
const counts={lanc:(d.transactions||[]).length, cat:(d.categories||[]).length, contas:(d.accounts||[]).length,
cartoes:(d.cards||[]).length, recorr:(d.recurrences||[]).length};
confirmModal({title:"Restaurar backup", okLabel:"Restaurar",
msg:`Backup de <b>${esc((obj.meta.exportedAt||"").slice(0,10))}</b> encontrado:<br><br>
• ${counts.lanc} lançamentos<br>• ${counts.cat} categorias<br>• ${counts.contas} contas<br>• ${counts.cartoes} cartões<br>• ${counts.recorr} recorrências<br><br>
<b>Os dados atuais serão substituídos.</b> Um backup automático dos dados atuais será baixado antes da restauração.`,
onOk:()=>{
autoBackupCurrent();
state=mergeDefaults({meta:{app:APP_ID,version:1}, ...d});
materializeAll(); save(); _fmtCache={}; applyTheme(); render();
toast("Backup restaurado com sucesso.");
}});
};
rd.readAsText(file);
}

else { r.nextDate = addDays(todayISO(), (r.desc==="Aluguel"?3:r.desc==="Netflix"?7:11)); }
